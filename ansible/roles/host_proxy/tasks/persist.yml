---
- name: Configure proxy on the provider host
  when: gitups_proxy_enabled
  block:
    - name: Render /etc/environment proxy lines
      ansible.builtin.blockinfile:
        path: /etc/environment
        create: true
        owner: root
        group: root
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED BLOCK gitups-proxy"
        block: |
          HTTP_PROXY={{ gitups_proxy_http_effective }}
          HTTPS_PROXY={{ gitups_proxy_https_effective }}
          NO_PROXY={{ gitups_proxy_no }}
          http_proxy={{ gitups_proxy_http_effective }}
          https_proxy={{ gitups_proxy_https_effective }}
          no_proxy={{ gitups_proxy_no }}
      no_log: "{{ (gitups_proxy_credentials_ref | length) > 0 }}"
      when: (gitups_proxy_credentials_ref | length) == 0

    - name: Render /etc/profile.d/gitups-proxy.sh
      ansible.builtin.copy:
        dest: /etc/profile.d/gitups-proxy.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          export HTTP_PROXY="{{ gitups_proxy_http_effective }}"
          export HTTPS_PROXY="{{ gitups_proxy_https_effective }}"
          export NO_PROXY="{{ gitups_proxy_no }}"
          export http_proxy="{{ gitups_proxy_http_effective }}"
          export https_proxy="{{ gitups_proxy_https_effective }}"
          export no_proxy="{{ gitups_proxy_no }}"
      no_log: "{{ (gitups_proxy_credentials_ref | length) > 0 }}"
      when: (gitups_proxy_credentials_ref | length) == 0

    # When credentials_ref is set, we deliberately skip writing the proxy
    # URL to /etc/environment and /etc/profile.d (would leak creds into
    # 0644 world-readable files). But if a prior run wrote those files
    # with a bare URL — back when creds_ref was empty — they survive and
    # are loaded by sshd/PAM into every login shell. That stale bare URL
    # then beats /root/.pip/pip.conf (env vars win), so pip tunnels with
    # no Proxy-Authorization header and Squid replies 407. Strip them so
    # only the 0600 systemd drop-in supplies the credentialed URL.
    - name: Remove stale /etc/environment proxy block when creds_ref is set
      ansible.builtin.blockinfile:
        path: /etc/environment
        marker: "# {mark} ANSIBLE MANAGED BLOCK gitups-proxy"
        state: absent
      failed_when: false
      when: (gitups_proxy_credentials_ref | length) > 0

    - name: Remove stale /etc/profile.d/gitups-proxy.sh when creds_ref is set
      ansible.builtin.file:
        path: /etc/profile.d/gitups-proxy.sh
        state: absent
      when: (gitups_proxy_credentials_ref | length) > 0

    - name: Stat dnf.conf
      ansible.builtin.stat:
        path: /etc/dnf/dnf.conf
      register: gitups_proxy_dnf_stat

    - name: Configure dnf proxy
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^proxy='
        line: "proxy={{ gitups_proxy_primary }}"
        insertafter: '^\[main\]'
        owner: root
        group: root
        mode: "{{ '0600' if (gitups_proxy_credentials_ref | length) > 0 else '0644' }}"
      no_log: "{{ (gitups_proxy_credentials_ref | length) > 0 }}"
      when: gitups_proxy_dnf_stat.stat.exists

    - name: Stat yum.conf (RHEL 7 / legacy)
      ansible.builtin.stat:
        path: /etc/yum.conf
      register: gitups_proxy_yum_stat

    - name: Configure yum proxy
      ansible.builtin.lineinfile:
        path: /etc/yum.conf
        regexp: '^proxy='
        line: "proxy={{ gitups_proxy_primary }}"
        insertafter: '^\[main\]'
        owner: root
        group: root
        mode: "{{ '0600' if (gitups_proxy_credentials_ref | length) > 0 else '0644' }}"
      no_log: "{{ (gitups_proxy_credentials_ref | length) > 0 }}"
      when: gitups_proxy_yum_stat.stat.exists

    - name: Ensure pip config directory
      ansible.builtin.file:
        path: /root/.pip
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Render pip proxy config
      ansible.builtin.copy:
        dest: /root/.pip/pip.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [global]
          proxy = {{ gitups_proxy_primary }}
      no_log: "{{ (gitups_proxy_credentials_ref | length) > 0 }}"

    # No containers.conf.d drop-in is rendered, deliberately. Podman
    # reads system-wide drop-ins for ROOTLESS invocations too, so a
    # 0600 file (which is what we'd need to hide a credentialed proxy
    # URL) breaks every non-root `podman` on the host with "permission
    # denied"; a 0644 file would leak the URL-embedded password to any
    # local user. Instead, gitups containers receive HTTP_PROXY via
    # the play-level `environment: gitups_proxy_env` block: the
    # ansible task running `podman run`/`podman pull` inherits the env
    # vars, and podman's default `--http-proxy=true` propagates them
    # into the container. This treatment is uniform across the
    # managed-Squid case and the bring-your-own authenticated external
    # proxy case — the URL form is identical, the wire behaviour is
    # identical, and credentials never land in a podman config file.
    #
    # Removing here also cleans up the 0600 file written by older
    # versions of this role (which broke rootless `podman` on the host).
    - name: Remove legacy containers.conf proxy drop-in
      ansible.builtin.file:
        path: /etc/containers/containers.conf.d/10-gitups-proxy.conf
        state: absent

    - name: Stat legacy containers.conf for cleanup
      ansible.builtin.stat:
        path: /etc/containers/containers.conf
      register: gitups_proxy_legacy_containers_conf

    - name: Remove legacy proxy block from /etc/containers/containers.conf
      ansible.builtin.blockinfile:
        path: /etc/containers/containers.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK gitups-proxy"
        state: absent
      when: gitups_proxy_legacy_containers_conf.stat.exists
      failed_when: false

    # An even older version of this role locked the main containers.conf
    # to 0600 to hide credentials. Credentials no longer land in any
    # podman config file (see drop-in note above), so restore the distro
    # default mode — otherwise regular users lose the ability to run
    # `podman info`.
    - name: Restore distro mode on /etc/containers/containers.conf
      ansible.builtin.file:
        path: /etc/containers/containers.conf
        owner: root
        group: root
        mode: "0644"
      when: gitups_proxy_legacy_containers_conf.stat.exists

    - name: Ensure systemd system.conf.d directory
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render systemd default proxy environment
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/10-gitups-proxy.conf
        owner: root
        group: root
        mode: "{{ '0600' if (gitups_proxy_credentials_ref | length) > 0 else '0644' }}"
        content: |
          [Manager]
          DefaultEnvironment="HTTP_PROXY={{ gitups_proxy_http_effective }}" "HTTPS_PROXY={{ gitups_proxy_https_effective }}" "NO_PROXY={{ gitups_proxy_no }}" "http_proxy={{ gitups_proxy_http_effective }}" "https_proxy={{ gitups_proxy_https_effective }}" "no_proxy={{ gitups_proxy_no }}"
      no_log: "{{ (gitups_proxy_credentials_ref | length) > 0 }}"
      register: gitups_proxy_systemd_dropin

    - name: Reload systemd manager when proxy drop-in changed
      ansible.builtin.systemd_service:
        daemon_reexec: true
      when: gitups_proxy_systemd_dropin.changed

# When proxy is disabled (or removed from env), strip every artifact a
# previous run wrote. Without this, systemd's DefaultEnvironment drop-in
# keeps injecting HTTPS_PROXY into every sshd-started session, so ansible
# commands hit a now-absent (or auth-mismatched) proxy and fail with 407.
- name: Strip stale proxy configuration when proxy is disabled
  when: not gitups_proxy_enabled
  block:
    - name: Remove proxy block from /etc/environment
      ansible.builtin.blockinfile:
        path: /etc/environment
        marker: "# {mark} ANSIBLE MANAGED BLOCK gitups-proxy"
        state: absent
      failed_when: false

    - name: Remove /etc/profile.d/gitups-proxy.sh
      ansible.builtin.file:
        path: /etc/profile.d/gitups-proxy.sh
        state: absent

    - name: Stat dnf.conf for proxy cleanup
      ansible.builtin.stat:
        path: /etc/dnf/dnf.conf
      register: gitups_proxy_cleanup_dnf_stat

    - name: Strip dnf proxy line
      ansible.builtin.lineinfile:
        path: /etc/dnf/dnf.conf
        regexp: '^proxy='
        state: absent
      when: gitups_proxy_cleanup_dnf_stat.stat.exists

    - name: Stat yum.conf for proxy cleanup
      ansible.builtin.stat:
        path: /etc/yum.conf
      register: gitups_proxy_cleanup_yum_stat

    - name: Strip yum proxy line
      ansible.builtin.lineinfile:
        path: /etc/yum.conf
        regexp: '^proxy='
        state: absent
      when: gitups_proxy_cleanup_yum_stat.stat.exists

    - name: Remove /root/.pip/pip.conf
      ansible.builtin.file:
        path: /root/.pip/pip.conf
        state: absent

    - name: Remove containers.conf proxy drop-in
      ansible.builtin.file:
        path: /etc/containers/containers.conf.d/10-gitups-proxy.conf
        state: absent

    - name: Stat legacy containers.conf for cleanup
      ansible.builtin.stat:
        path: /etc/containers/containers.conf
      register: gitups_proxy_cleanup_legacy_containers_conf

    - name: Remove legacy proxy block from /etc/containers/containers.conf
      ansible.builtin.blockinfile:
        path: /etc/containers/containers.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK gitups-proxy"
        state: absent
      when: gitups_proxy_cleanup_legacy_containers_conf.stat.exists
      failed_when: false

    - name: Remove systemd proxy drop-in
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d/10-gitups-proxy.conf
        state: absent
      register: gitups_proxy_cleanup_systemd_dropin

    - name: Reload systemd manager when proxy drop-in removed
      ansible.builtin.systemd_service:
        daemon_reexec: true
      when: gitups_proxy_cleanup_systemd_dropin.changed
