---

- name: Fail until IPMI BMC support is implemented
  ansible.builtin.fail:
    msg: |
      bmc_ipmi is a scaffold. To enable, model IPMI endpoints on
      MachineBareMetalSpec.BMC (protocol: ipmi) and implement the ipmitool
      based power/media commands here. Most lab and modern bare metal
      should use bmc_redfish instead.
