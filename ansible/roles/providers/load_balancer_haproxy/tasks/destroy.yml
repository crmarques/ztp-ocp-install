---
- name: Remove HAProxy containers
  containers.podman.podman_container:
    name: "bootwright-haproxy-{{ item.name }}"
    state: absent
  loop: "{{ bootwright_current_load_balancers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove load balancer state directories
  ansible.builtin.file:
    path: "{{ bootwright_host_state_dir }}/load-balancers/{{ item.name }}"
    state: absent
  loop: "{{ bootwright_current_load_balancers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove empty load-balancers directory
  ansible.builtin.command:
    argv:
      - rmdir
      - "{{ bootwright_host_state_dir }}/load-balancers"
  register: bootwright_lb_parent_rm
  failed_when: false
  changed_when: bootwright_lb_parent_rm.rc == 0

- name: Remove HAProxy sysctl drop-in
  ansible.builtin.file:
    path: /etc/sysctl.d/99-bootwright-haproxy.conf
    state: absent
