---
- name: Install HAProxy container runtime
  ansible.builtin.package:
    name: podman
    state: present

- name: Enable HAProxy VIP binding
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-bootwright-haproxy.conf
    sysctl_set: true
    reload: true

- name: Reconcile HAProxy load balancers
  ansible.builtin.include_tasks: haproxy.yml
  loop: "{{ bootwright_current_load_balancers }}"
  loop_control:
    loop_var: bootwright_current_load_balancer
    label: "{{ bootwright_current_load_balancer.name }}"
