---
bootwright_forward_proxy_root: "{{ bootwright_current_forward_proxy.dataDir | default(bootwright_host_state_dir ~ '/forward-proxy/' ~ bootwright_current_forward_proxy.name, true) }}"
bootwright_forward_proxy_config_dir: "{{ bootwright_forward_proxy_root }}/config"
bootwright_forward_proxy_auth_dir: "{{ bootwright_forward_proxy_root }}/auth"
bootwright_forward_proxy_cache_dir: "{{ bootwright_forward_proxy_root }}/cache"
bootwright_forward_proxy_logs_dir: "{{ bootwright_forward_proxy_root }}/logs"
bootwright_forward_proxy_container_name: "bootwright-squid-{{ bootwright_current_forward_proxy.name }}"
# openEuler Squid 7.5 refuses to run as root — must use the image's
# baked-in squid user (UID 1000). Sync with DefaultSquidImageRef.
bootwright_forward_proxy_runtime_uid: "1000"
bootwright_forward_proxy_runtime_gid: "1000"
