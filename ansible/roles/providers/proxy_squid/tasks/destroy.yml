---
- name: Stop and remove managed Squid proxy container
  containers.podman.podman_container:
    name: "gitups-squid-{{ gitups_current_forward_proxy.name }}"
    state: absent
  when: gitups_current_forward_proxy is not none
  failed_when: false

- name: Remove managed Squid /etc/hosts pin
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} GITUPS managed-forward-proxy {{ gitups_current_forward_proxy.name }}"
    state: absent
  when: gitups_current_forward_proxy is not none
  failed_when: false

- name: Check firewalld state before closing managed Squid port
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --state
  register: gitups_squid_firewalld_state
  changed_when: false
  failed_when: false
  when: gitups_current_forward_proxy is not none

- name: Close managed Squid port on provider host firewall
  ansible.posix.firewalld:
    port: "{{ gitups_current_forward_proxy.port | int }}/tcp"
    state: disabled
    permanent: true
    immediate: true
  when:
    - gitups_current_forward_proxy is not none
    - gitups_squid_firewalld_state.rc | default(1) == 0

- name: Remove managed Squid state directory
  ansible.builtin.file:
    path: "{{ gitups_current_forward_proxy.dataDir | default(gitups_host_state_dir ~ '/forward-proxy/' ~ gitups_current_forward_proxy.name, true) }}"
    state: absent
  when: gitups_current_forward_proxy is not none

- name: Remove forward-proxy parent directory if empty
  ansible.builtin.command:
    argv:
      - rmdir
      - "{{ gitups_host_state_dir }}/forward-proxy"
  register: gitups_forward_proxy_parent_rm
  failed_when: false
  changed_when: gitups_forward_proxy_parent_rm.rc == 0
