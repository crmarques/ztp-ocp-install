---
- name: Install mirror registry packages
  ansible.builtin.package:
    name:
      - podman
      - skopeo
      - httpd-tools
      - ca-certificates
    state: present

- name: Create mirror registry directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ bootwright_mirror_registry_root }}", mode: "0755" }
    - { path: "{{ bootwright_mirror_registry_auth_dir }}", mode: "0700" }
    - { path: "{{ bootwright_mirror_registry_certs_dir }}", mode: "0700" }
    - { path: "{{ bootwright_mirror_registry_data_dir }}", mode: "0755" }
    - { path: "{{ bootwright_mirror_registry_tools_dir }}", mode: "0755" }

- name: Record mirror registry requirements
  ansible.builtin.copy:
    dest: "{{ bootwright_mirror_registry_root }}/requirements.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      name: {{ bootwright_current_mirror_registry.name }}
      providerRef: {{ bootwright_current_mirror_registry.providerRef }}
      providerHostRef: {{ bootwright_current_mirror_registry.providerHostRef }}
      url: {{ bootwright_current_mirror_registry.url }}
      host: {{ bootwright_current_mirror_registry.host }}
      port: {{ bootwright_current_mirror_registry.port }}
      runtime: {{ bootwright_current_mirror_registry.runtime }}
      image:
        local: {{ bootwright_current_mirror_registry.image.local | default('') }}
        public: {{ bootwright_current_mirror_registry.image.public | default('') }}
  register: bootwright_mirror_registry_requirements

- name: Record mirror image set
  ansible.builtin.copy:
    dest: "{{ bootwright_mirror_registry_root }}/mirror-set.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      mirrorSet:
      {% for entry in bootwright_current_mirror_registry.mirrorSet %}
        - kind: {{ entry.kind }}
          public: {{ entry.public }}
          local: {{ entry.local }}
      {% endfor %}
