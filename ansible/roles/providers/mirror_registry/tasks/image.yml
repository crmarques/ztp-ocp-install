---
- name: Pull mirror registry server image from local registry
  containers.podman.podman_image:
    name: "{{ bootwright_current_mirror_registry.image.local }}"
    state: present
    pull: true
  register: bootwright_mirror_registry_pull_local
  failed_when: false
  when: (bootwright_current_mirror_registry.image.local | default('')) | length > 0

- name: Check whether mirror registry local image is in podman storage
  ansible.builtin.command:
    argv:
      - podman
      - image
      - exists
      - "{{ bootwright_current_mirror_registry.image.local }}"
  register: bootwright_mirror_registry_local_present
  changed_when: false
  failed_when: false
  when: (bootwright_current_mirror_registry.image.local | default('')) | length > 0

- name: Pull mirror registry server image from public registry
  containers.podman.podman_image:
    name: "{{ bootwright_current_mirror_registry.image.public }}"
    state: present
    pull: true
  register: bootwright_mirror_registry_pull_public
  failed_when: false
  when:
    - (bootwright_current_mirror_registry.image.public | default('')) | length > 0
    - >-
      (bootwright_current_mirror_registry.image.local | default('')) | length == 0
      or (bootwright_mirror_registry_local_present.rc | default(1) != 0)

- name: Check whether mirror registry public image is in podman storage
  ansible.builtin.command:
    argv:
      - podman
      - image
      - exists
      - "{{ bootwright_current_mirror_registry.image.public }}"
  register: bootwright_mirror_registry_public_present
  changed_when: false
  failed_when: false
  when: (bootwright_current_mirror_registry.image.public | default('')) | length > 0

- name: Resolve mirror registry server image ref for run
  ansible.builtin.set_fact:
    bootwright_mirror_registry_run_image: >-
      {{ bootwright_current_mirror_registry.image.local
         if (bootwright_mirror_registry_local_present.rc | default(1) == 0)
         else bootwright_current_mirror_registry.image.public }}

- name: Fail when mirror registry server image cannot be pulled
  ansible.builtin.fail:
    msg: >-
      Mirror registry server image pull failed.
      local={{ bootwright_current_mirror_registry.image.local | default('<unset>') }},
      public={{ bootwright_current_mirror_registry.image.public | default('<unset>') }}.
      First apply requires outbound reachability to the public ref;
      subsequent applies pull from the local mirror.
  when:
    - (bootwright_mirror_registry_local_present.rc | default(1) != 0)
    - (bootwright_mirror_registry_public_present.rc | default(1) != 0)
