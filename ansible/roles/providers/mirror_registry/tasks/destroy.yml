---
- name: Remove mirror registry container
  containers.podman.podman_container:
    name: "bootwright-mirror-registry-{{ bootwright_current_mirror_registry.name }}"
    state: absent
  when: bootwright_current_mirror_registry is not none
  failed_when: false

- name: Remove mirror registry CA trust
  ansible.builtin.file:
    path: "/etc/pki/ca-trust/source/anchors/bootwright-mirror-{{ bootwright_current_mirror_registry.host }}.crt"
    state: absent
  register: bootwright_mirror_registry_trust_remove
  when: bootwright_current_mirror_registry is not none

- name: Refresh host CA trust store
  ansible.builtin.command:
    argv:
      - update-ca-trust
  when:
    - bootwright_current_mirror_registry is not none
    - bootwright_mirror_registry_trust_remove.changed
  changed_when: bootwright_mirror_registry_trust_remove.changed

- name: Remove mirror registry state directory
  ansible.builtin.file:
    path: "{{ bootwright_host_state_dir }}/mirror-registry/{{ bootwright_current_mirror_registry.name }}"
    state: absent
  when:
    - bootwright_current_mirror_registry is not none
    - not (bootwright_keep_mirrored_images | default(false) | bool)

- name: Remove mirror registry transient files
  ansible.builtin.file:
    path: "{{ bootwright_host_state_dir }}/mirror-registry/{{ bootwright_current_mirror_registry.name }}/{{ item }}"
    state: absent
  loop:
    - auth
    - certs
    - tools
    - requirements.yml
    - mirror-set.yml
    - last-inspect.json
    - last-run.log
    - mirror-results.json
  when:
    - bootwright_current_mirror_registry is not none
    - bootwright_keep_mirrored_images | default(false) | bool

- name: Report retained mirror registry data
  ansible.builtin.debug:
    msg: "Retained mirror registry data volume at {{ bootwright_host_state_dir }}/mirror-registry/{{ bootwright_current_mirror_registry.name }}/data"
  when:
    - bootwright_current_mirror_registry is not none
    - bootwright_keep_mirrored_images | default(false) | bool

- name: Remove empty mirror-registry directory
  ansible.builtin.command:
    argv:
      - rmdir
      - "{{ bootwright_host_state_dir }}/mirror-registry"
  register: bootwright_mirror_registry_parent_rm
  failed_when: false
  changed_when: bootwright_mirror_registry_parent_rm.rc == 0
