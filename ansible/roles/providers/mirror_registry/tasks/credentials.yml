---
- name: Slurp mirror registry credentials secret
  ansible.builtin.slurp:
    src: "{{ bootwright_current_mirror_registry.credentialsSecretName }}"
  register: bootwright_mirror_registry_credentials_raw
  no_log: true
  delegate_to: localhost
  become: false
  when: (bootwright_current_mirror_registry.credentialsSecretName | default('')) | length > 0

- name: Parse mirror registry credentials
  ansible.builtin.set_fact:
    bootwright_mirror_registry_credentials: "{{ bootwright_mirror_registry_credentials_raw | bootwright_parse_credential('mirror registry credentialsSecret ' ~ bootwright_current_mirror_registry.credentialsSecretName) }}"
  no_log: true
  when: bootwright_mirror_registry_credentials_raw is defined and bootwright_mirror_registry_credentials_raw.content is defined

- name: Expose mirror registry username and password as facts
  ansible.builtin.set_fact:
    bootwright_mirror_registry_username: "{{ bootwright_mirror_registry_credentials.username }}"
    bootwright_mirror_registry_password: "{{ bootwright_mirror_registry_credentials.password }}"
  no_log: true
  when: bootwright_mirror_registry_credentials is defined

- name: Verify existing mirror registry htpasswd
  ansible.builtin.command:
    argv:
      - htpasswd
      - -viB
      - "{{ bootwright_mirror_registry_auth_dir }}/htpasswd"
      - "{{ bootwright_mirror_registry_username }}"
    stdin: "{{ bootwright_mirror_registry_password }}"
  register: bootwright_mirror_registry_htpasswd_verify
  changed_when: false
  failed_when: false
  no_log: true
  when: bootwright_mirror_registry_credentials is defined

- name: Generate mirror registry htpasswd content
  ansible.builtin.command:
    argv:
      - htpasswd
      - -niB
      - "{{ bootwright_mirror_registry_username }}"
    stdin: "{{ bootwright_mirror_registry_password }}"
  register: bootwright_mirror_registry_htpasswd_generate
  changed_when: false
  no_log: true
  when:
    - bootwright_mirror_registry_credentials is defined
    - bootwright_mirror_registry_htpasswd_verify.rc | default(1) != 0

- name: Write mirror registry htpasswd file
  ansible.builtin.copy:
    dest: "{{ bootwright_mirror_registry_auth_dir }}/htpasswd"
    owner: root
    group: root
    mode: "0600"
    content: "{{ bootwright_mirror_registry_htpasswd_generate.stdout }}\n"
  register: bootwright_mirror_registry_htpasswd_create
  no_log: true
  when:
    - bootwright_mirror_registry_credentials is defined
    - bootwright_mirror_registry_htpasswd_verify.rc | default(1) != 0

- name: Compute mirror registry htpasswd checksum
  ansible.builtin.stat:
    path: "{{ bootwright_mirror_registry_auth_dir }}/htpasswd"
  register: bootwright_mirror_registry_htpasswd_stat

- name: Slurp mirror registry TLS certificate
  ansible.builtin.slurp:
    src: "{{ bootwright_current_mirror_registry.trustBundleCertSecretName }}"
  register: bootwright_mirror_registry_cert_raw
  no_log: true
  delegate_to: localhost
  become: false
  when: (bootwright_current_mirror_registry.trustBundleCertSecretName | default('')) | length > 0

- name: Slurp mirror registry TLS key
  ansible.builtin.slurp:
    src: "{{ bootwright_current_mirror_registry.trustBundleKeySecretName }}"
  register: bootwright_mirror_registry_key_raw
  no_log: true
  delegate_to: localhost
  become: false
  when: (bootwright_current_mirror_registry.trustBundleKeySecretName | default('')) | length > 0

- name: Write mirror registry TLS certificate
  ansible.builtin.copy:
    dest: "{{ bootwright_mirror_registry_certs_dir }}/registry.crt"
    owner: root
    group: root
    mode: "0644"
    content: "{{ bootwright_mirror_registry_cert_raw.content | b64decode }}"
  when: bootwright_mirror_registry_cert_raw is defined and bootwright_mirror_registry_cert_raw.content is defined
  register: bootwright_mirror_registry_cert_write

- name: Write mirror registry TLS key
  ansible.builtin.copy:
    dest: "{{ bootwright_mirror_registry_certs_dir }}/registry.key"
    owner: root
    group: root
    mode: "0600"
    content: "{{ bootwright_mirror_registry_key_raw.content | b64decode }}"
  no_log: true
  when: bootwright_mirror_registry_key_raw is defined and bootwright_mirror_registry_key_raw.content is defined

- name: Apply mirror registry trust to host CA store
  ansible.builtin.include_tasks: setup-trust.yml
  when: bootwright_mirror_registry_cert_write is defined
