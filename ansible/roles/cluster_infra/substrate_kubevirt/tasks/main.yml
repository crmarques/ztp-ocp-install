- name: Fail until KubeVirt substrate support is implemented
  ansible.builtin.fail:
    msg: |
      substrate_kubevirt is a scaffold. To enable, extend
      OpenShiftVirtualizationSpec with namespace/storage/network fields and
      project them in internal/provisioning/render/vars.go, then implement the
      VirtualMachine apply tasks here using kubernetes.core.k8s.
