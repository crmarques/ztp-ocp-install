---

- name: Select load balancer VIPs to remove
  ansible.builtin.set_fact:
    bootwright_cluster_vips_unplumb_targets: >-
      {{
        (bootwright_load_balancers | default([]))
        | selectattr('clusterName', 'equalto', bootwright_current_cluster.name)
        | map(attribute='frontends') | flatten
        | map(attribute='bindings') | flatten
        | selectattr('bridgeAttachment', 'defined')
        | rejectattr('bridgeAttachment', 'equalto', None)
        | map('to_json') | unique | map('from_json') | list
      }}
  changed_when: false

- name: Detach load balancer VIPs
  ansible.builtin.command:
    argv:
      - ip
      - address
      - del
      - "{{ item.bindAddress }}/{{ item.bridgeAttachment.prefixLength }}"
      - dev
      - "{{ item.bridgeAttachment.bridge }}"
  register: bootwright_cluster_vips_unplumb
  changed_when: bootwright_cluster_vips_unplumb.rc == 0
  failed_when:
    - bootwright_cluster_vips_unplumb.rc != 0
    - "'Cannot assign requested address' not in (bootwright_cluster_vips_unplumb.stderr | default(''))"
    - "'Cannot find device' not in (bootwright_cluster_vips_unplumb.stderr | default(''))"
  loop: "{{ bootwright_cluster_vips_unplumb_targets }}"
  loop_control:
    label: "{{ item.bindAddress }}/{{ item.bridgeAttachment.prefixLength }} dev {{ item.bridgeAttachment.bridge }}"
