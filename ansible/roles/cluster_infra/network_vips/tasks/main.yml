---

- name: Select cluster VIPs for libvirt bridges
  ansible.builtin.set_fact:
    bootwright_cluster_vips_lb_bindings: >-
      {{
        (bootwright_load_balancers | default([]))
        | selectattr('clusterName', 'equalto', bootwright_current_cluster.name)
        | map(attribute='frontends') | flatten
        | map(attribute='bindings') | flatten
        | selectattr('clusterName', 'equalto', bootwright_current_cluster.name)
        | list
      }}
  changed_when: false

- name: Match VIPs to libvirt bridges
  ansible.builtin.set_fact:
    bootwright_cluster_vips_targets: >-
      {{
        bootwright_cluster_vips_targets | default([]) +
        (
          bootwright_cluster_vips_lb_bindings
          | selectattr('bindAddress', 'defined')
          | rejectattr('bindAddress', 'equalto', '')
          | selectattr('bindAddress', 'bootwright_in_cidr', item.cidr)
          | map('combine', {'bridge': item.libvirt.bridge, 'cidr': item.cidr})
          | list
        )
      }}
  changed_when: false
  loop: "{{ bootwright_current_cluster.network.machineNetworks | selectattr('libvirt', 'defined') | list }}"
  loop_control:
    label: "{{ item.libvirt.bridge | default('?') }} {{ item.cidr }}"

- name: Attach load balancer VIPs
  ansible.builtin.command:
    argv:
      - ip
      - address
      - add
      - "{{ item.bindAddress }}/{{ item.cidr.split('/') | last }}"
      - dev
      - "{{ item.bridge }}"
  register: bootwright_cluster_vips_plumb
  changed_when: bootwright_cluster_vips_plumb.rc == 0
  failed_when:
    - bootwright_cluster_vips_plumb.rc != 0
    - "'File exists' not in (bootwright_cluster_vips_plumb.stderr | default(''))"
    - "'Address already assigned' not in (bootwright_cluster_vips_plumb.stderr | default(''))"
  loop: "{{ bootwright_cluster_vips_targets | default([]) }}"
  loop_control:
    label: "{{ item.bindAddress }} dev {{ item.bridge }}"
