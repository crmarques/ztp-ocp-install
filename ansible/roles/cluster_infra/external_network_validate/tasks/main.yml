---
- name: Validate external API DNS
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ item }}"
  loop:
    - "{{ bootwright_current_cluster.network.records.api }}"
    - "{{ bootwright_current_cluster.network.records.apiInt }}"
  changed_when: false
  when: bootwright_current_cluster.network.nameResolution.mode == 'external'

- name: Create external network state directory
  ansible.builtin.file:
    path: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: bootwright_current_cluster.network.nameResolution.mode == 'external' or bootwright_current_cluster.network.loadBalancer.external | default(false) | bool

- name: Record external network expectations
  ansible.builtin.copy:
    dest: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/external-network.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      endpoints:
        api:
          hostname: {{ bootwright_current_cluster.network.endpoints.api.hostname }}
          address: {{ bootwright_current_cluster.network.endpoints.api.address }}
        apiInt:
          hostname: {{ bootwright_current_cluster.network.endpoints.apiInt.hostname }}
          address: {{ bootwright_current_cluster.network.endpoints.apiInt.address }}
        ingress:
          hostname: "{{ bootwright_current_cluster.network.endpoints.ingress.hostname }}"
          address: {{ bootwright_current_cluster.network.endpoints.ingress.address }}
      loadBalancerMode: {{ bootwright_current_cluster.network.loadBalancer.mode }}
      nameResolutionMode: {{ bootwright_current_cluster.network.nameResolution.mode }}
  when: bootwright_current_cluster.network.nameResolution.mode == 'external' or bootwright_current_cluster.network.loadBalancer.external | default(false) | bool
