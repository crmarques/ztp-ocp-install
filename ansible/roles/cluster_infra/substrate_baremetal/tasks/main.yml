---

- name: Select bare-metal machines
  ansible.builtin.set_fact:
    bootwright_baremetal_machines: >-
      {{
        bootwright_current_cluster.ocp.nodes
        | selectattr('bareMetal', 'defined')
        | rejectattr('bareMetal', 'equalto', None)
        | list
      }}
  changed_when: false

- name: Validate bare-metal BMC details
  ansible.builtin.assert:
    that:
      - bootwright_baremetal_machines | length == bootwright_current_cluster.ocp.nodes | length
      - bootwright_baremetal_machines | rejectattr('bareMetal.address', 'defined') | list | length == 0
    fail_msg: "Every machine in cluster {{ bootwright_current_cluster.name }} must declare bareMetal.bmc.address; got {{ bootwright_baremetal_machines | length }} of {{ bootwright_current_cluster.ocp.nodes | length }} with BMC info"

- name: Select BMC credential files
  ansible.builtin.set_fact:
    bootwright_baremetal_credential_refs: >-
      {{
        bootwright_baremetal_machines
        | map(attribute='bareMetal.credentialRef')
        | select('truthy') | unique | list
      }}
  changed_when: false

- name: Check BMC credential files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ bootwright_baremetal_credential_refs }}"
  register: bootwright_baremetal_credential_stats

- name: Validate BMC credential files
  ansible.builtin.fail:
    msg: "Missing bare-metal BMC credentials at {{ item.item }}"
  loop: "{{ bootwright_baremetal_credential_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (item.stat.exists | default(false))

- name: Create bare-metal state directory
  ansible.builtin.file:
    path: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/baremetal"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record bare-metal manifest
  ansible.builtin.copy:
    dest: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/baremetal/manifest.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      cluster: {{ bootwright_current_cluster.name }}
      machines:
      {% for node in bootwright_baremetal_machines %}
        - name: {{ node.name }}
          role: {{ node.role }}
          ipAddress: {{ node.ipAddress }}
          macAddress: {{ node.macAddress }}
          bmc:
            address: {{ node.bareMetal.address }}
            {% if node.bareMetal.protocol | default('') | length > 0 %}
            protocol: {{ node.bareMetal.protocol }}
            {% endif %}
            {% if (node.bareMetal.port | default(0)) > 0 %}
            port: {{ node.bareMetal.port }}
            {% endif %}
            credentialRef: {{ node.bareMetal.credentialRef | default('') }}
            disableCertificateVerification: {{ node.bareMetal.disableCertificateVerification | default(false) }}
      {% endfor %}
