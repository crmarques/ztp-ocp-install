---
- name: Ensure libvirt host packages and service
  ansible.builtin.import_role:
    name: host_libvirt

- name: Create libvirt storage directory
  ansible.builtin.file:
    path: "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}/qemu"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record libvirt desired state
  ansible.builtin.copy:
    dest: "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}/qemu/virtualization.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      type: {{ gitups_current_cluster.provider.virtualization.type }}
      libvirt:
        network: {{ gitups_current_cluster.provider.virtualization.libvirt.network }}
        bridge: {{ gitups_current_cluster.provider.virtualization.libvirt.bridge }}
        egressRestrictedToProxy: {{ gitups_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool }}
        proxyURL: {{ gitups_current_cluster.provider.virtualization.libvirt.proxyURL | default('') }}
      defaultNode:
        cpu: {{ gitups_current_cluster.provider.virtualization.defaultNode.cpu }}
        memoryMiB: {{ gitups_current_cluster.provider.virtualization.defaultNode.memoryMiB }}
        diskGiB: {{ gitups_current_cluster.provider.virtualization.defaultNode.diskGiB }}
      nodes:
      {% for node in gitups_current_cluster.provider.nodes %}
        - name: {{ node.name }}
          role: {{ node.role }}
          hostRef: {{ node.hostRef }}
          ipAddress: {{ node.ipAddress }}
          macAddress: {{ node.macAddress }}
          resources:
            cpu: {{ node.resources.cpu }}
            memoryMiB: {{ node.resources.memoryMiB }}
            diskGiB: {{ node.resources.diskGiB }}
      {% endfor %}

- name: List libvirt networks
  community.libvirt.virt_net:
    command: list_nets
  register: gitups_libvirt_net_list
  changed_when: false

- name: Check target libvirt network
  ansible.builtin.set_fact:
    gitups_libvirt_net_exists: "{{ gitups_current_cluster.provider.virtualization.libvirt.network in (gitups_libvirt_net_list.list_nets | default([])) }}"
  changed_when: false

- name: Read live libvirt network XML
  community.libvirt.virt_net:
    command: get_xml
    name: "{{ gitups_current_cluster.provider.virtualization.libvirt.network }}"
  register: gitups_libvirt_net_existing_xml
  failed_when: false
  changed_when: false
  when: gitups_libvirt_net_exists

- name: Select libvirt network UUID
  ansible.builtin.set_fact:
    gitups_libvirt_net_uuid: >-
      {{
        ((gitups_libvirt_net_existing_xml.get_xml | default(''))
          | regex_search('[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'))
        if gitups_libvirt_net_exists
        else (gitups_current_cluster.name ~ '-net-' ~ gitups_current_cluster.provider.virtualization.libvirt.network) | to_uuid
      }}
  changed_when: false

- name: Select machine network
  ansible.builtin.set_fact:
    gitups_libvirt_machine_network: >-
      {{
        (gitups_current_cluster.network.machineNetworks
          | selectattr('libvirt', 'defined')
          | selectattr('libvirt.bridge', 'equalto', gitups_current_cluster.provider.virtualization.libvirt.bridge)
          | list
          | first)
        | default(gitups_current_cluster.network.machineNetworks | first)
      }}
  changed_when: false

- name: Compute libvirt network fingerprint
  ansible.builtin.set_fact:
    gitups_libvirt_net_fingerprint: >-
      {{
        ([
          gitups_libvirt_machine_network.gateway,
          gitups_libvirt_machine_network.cidr,
          gitups_current_cluster.provider.virtualization.libvirt.bridge,
          (gitups_current_cluster.provider.virtualization.libvirt.dnsHosts | default([])),
          (gitups_current_cluster.provider.nodes | default([])
            | map(attribute='macAddress') | list),
          (gitups_current_cluster.provider.nodes | default([])
            | map(attribute='ipAddress') | list),
          (gitups_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool),
          'no-hosts',
        ] | to_json) | hash('sha1')
      }}
  changed_when: false

- name: Render libvirt network XML
  ansible.builtin.set_fact:
    gitups_libvirt_net_xml_content: |
      <network xmlns:dnsmasq='http://libvirt.org/schemas/network/dnsmasq/1.0'>
        <name>{{ gitups_current_cluster.provider.virtualization.libvirt.network }}</name>
        <uuid>{{ gitups_libvirt_net_uuid }}</uuid>
        <description>gitups-net-fingerprint:{{ gitups_libvirt_net_fingerprint }}</description>
        {% if not (gitups_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool) %}
        <forward mode='nat'>
          <nat>
            <port start='1024' end='65535'/>
          </nat>
        </forward>
        {% endif %}
        <bridge name='{{ gitups_current_cluster.provider.virtualization.libvirt.bridge }}' stp='on' delay='0'/>
        {% if (gitups_current_cluster.provider.virtualization.libvirt.dnsHosts | default([])) | length > 0 %}
        <dns>
        {% for host in gitups_current_cluster.provider.virtualization.libvirt.dnsHosts %}
          <host ip='{{ host.ip }}'>
            {% for hostname in host.hostnames %}
            <hostname>{{ hostname }}</hostname>
            {% endfor %}
          </host>
        {% endfor %}
        </dns>
        {% endif %}
        <ip address='{{ gitups_libvirt_machine_network.gateway }}' prefix='{{ gitups_libvirt_machine_network.cidr.split("/") | last }}'>
          <dhcp>
          {% for node in gitups_current_cluster.provider.nodes %}
          {% if (node.macAddress | default('') | length > 0) and (node.ipAddress | default('') | length > 0) %}
            <host mac='{{ node.macAddress }}' name='{{ gitups_current_cluster.name }}-{{ node.name }}' ip='{{ node.ipAddress }}'/>
          {% endif %}
          {% endfor %}
          </dhcp>
        </ip>
        <dnsmasq:options>
          <dnsmasq:option value='no-hosts'/>
        </dnsmasq:options>
      </network>

- name: Save rendered libvirt network XML
  ansible.builtin.copy:
    dest: "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}/qemu/network.xml"
    owner: root
    group: root
    mode: "0644"
    content: "{{ gitups_libvirt_net_xml_content }}"
  register: gitups_libvirt_net_xml_file

- name: Detect libvirt network drift
  ansible.builtin.set_fact:
    gitups_libvirt_net_drifted: >-
      {{
        gitups_libvirt_net_exists
        and ('gitups-net-fingerprint:' ~ gitups_libvirt_net_fingerprint)
            not in (gitups_libvirt_net_existing_xml.get_xml | default(''))
      }}
  changed_when: false

- name: Remove conflicting libvirt bridges
  when: not gitups_libvirt_net_exists
  block:
    - name: Read XML for every other libvirt network
      community.libvirt.virt_net:
        command: get_xml
        name: "{{ item }}"
      register: gitups_libvirt_other_net_xmls
      loop: "{{ (gitups_libvirt_net_list.list_nets | default([])) | reject('equalto', gitups_current_cluster.provider.virtualization.libvirt.network) | list }}"
      failed_when: false
      changed_when: false

    - name: Resolve libvirt networks claiming this bridge
      ansible.builtin.set_fact:
        gitups_libvirt_conflicting_nets: >-
          {{
            gitups_libvirt_other_net_xmls.results
            | default([])
            | selectattr('get_xml', 'defined')
            | selectattr('get_xml', 'search', "<bridge name='" ~ gitups_current_cluster.provider.virtualization.libvirt.bridge ~ "'")
            | map(attribute='item')
            | list
          }}
      changed_when: false

    - name: Stop and undefine conflicting libvirt networks
      community.libvirt.virt_net:
        name: "{{ item }}"
        state: absent
      loop: "{{ gitups_libvirt_conflicting_nets }}"
      failed_when: false

- name: Stop changed libvirt network
  community.libvirt.virt_net:
    name: "{{ gitups_current_cluster.provider.virtualization.libvirt.network }}"
    state: inactive
  when:
    - gitups_libvirt_net_exists
    - gitups_libvirt_net_xml_file.changed or gitups_libvirt_net_drifted | bool

- name: Define libvirt network
  community.libvirt.virt_net:
    name: "{{ gitups_current_cluster.provider.virtualization.libvirt.network }}"
    state: present
    xml: "{{ gitups_libvirt_net_xml_content }}"

- name: Enable libvirt network autostart
  community.libvirt.virt_net:
    name: "{{ gitups_current_cluster.provider.virtualization.libvirt.network }}"
    autostart: true

- name: Start libvirt network
  community.libvirt.virt_net:
    name: "{{ gitups_current_cluster.provider.virtualization.libvirt.network }}"
    state: active

- name: Check firewalld state
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --state
  register: gitups_firewalld_state
  changed_when: false
  failed_when: false

- name: Assign bridge to libvirt firewalld zone
  ansible.posix.firewalld:
    zone: libvirt
    interface: "{{ gitups_current_cluster.provider.virtualization.libvirt.bridge }}"
    state: enabled
    permanent: true
    immediate: true
  when:
    - gitups_firewalld_state.rc == 0
    - (gitups_current_cluster.provider.bootArtifactsHttp.enabled | default(false) | bool) or (gitups_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool)

- name: Open boot artifact HTTP port
  ansible.posix.firewalld:
    zone: libvirt
    port: "{{ gitups_current_cluster.provider.bootArtifactsHttp.port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when:
    - gitups_firewalld_state.rc == 0
    - gitups_current_cluster.provider.bootArtifactsHttp.enabled | default(false) | bool

- name: Open managed proxy port
  ansible.posix.firewalld:
    zone: libvirt
    port: "{{ gitups_current_cluster.provider.virtualization.libvirt.proxyPort | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when:
    - gitups_firewalld_state.rc == 0
    - gitups_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool
    - (gitups_current_cluster.provider.virtualization.libvirt.proxyPort | default(0) | int) > 0

- name: Check QEMU emulator candidates
  ansible.builtin.stat:
    path: "{{ item }}"
  register: gitups_qemu_emulator_candidate_stats
  loop:
    - /usr/bin/qemu-kvm
    - /usr/libexec/qemu-kvm
    - /usr/bin/qemu-system-x86_64

- name: Select QEMU emulator
  ansible.builtin.set_fact:
    gitups_qemu_emulator_path: "{{ gitups_qemu_emulator_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | first | default('') }}"

- name: Validate QEMU emulator
  ansible.builtin.fail:
    msg: "No QEMU emulator found. Expected one of: /usr/bin/qemu-kvm, /usr/libexec/qemu-kvm, /usr/bin/qemu-system-x86_64"
  when: gitups_qemu_emulator_path == ""

- name: Create VM directories
  ansible.builtin.file:
    path: "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}/qemu/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ gitups_current_cluster.provider.nodes }}"

- name: Create VM disks
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}/qemu/{{ item.name }}/disk.qcow2"
      - "{{ item.resources.diskGiB }}G"
  args:
    creates: "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}/qemu/{{ item.name }}/disk.qcow2"
  loop: "{{ gitups_current_cluster.provider.nodes }}"

- name: Read live libvirt domain XML
  community.libvirt.virt:
    command: get_xml
    name: "{{ gitups_current_cluster.name }}-{{ item.name }}"
  register: gitups_qemu_domain_xmls
  failed_when: false
  changed_when: false
  loop: "{{ gitups_current_cluster.provider.nodes }}"

- name: Select libvirt domain UUIDs
  ansible.builtin.set_fact:
    gitups_qemu_node_uuids: >-
      {{
        gitups_qemu_node_uuids | default({}) | combine({
          item.item.name: (
            (item.get_xml | default('') | regex_search('[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'))
            if (item.get_xml | default('') | length) > 0
            else (gitups_current_cluster.name ~ '-' ~ item.item.name) | to_uuid
          )
        })
      }}
  loop: "{{ gitups_qemu_domain_xmls.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Render VM domain XML
  ansible.builtin.template:
    src: domain.xml.j2
    dest: "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}/qemu/{{ item.name }}/domain.xml"
    owner: root
    group: root
    mode: "0644"
  vars:
    gitups_qemu_node: "{{ item }}"
  loop: "{{ gitups_current_cluster.provider.nodes }}"

- name: Read rendered VM domain XML
  ansible.builtin.slurp:
    src: "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}/qemu/{{ item.name }}/domain.xml"
  register: gitups_qemu_domain_xml_slurp
  loop: "{{ gitups_current_cluster.provider.nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Define libvirt domains
  community.libvirt.virt:
    command: define
    xml: "{{ item.content | b64decode }}"
  loop: "{{ gitups_qemu_domain_xml_slurp.results }}"
  loop_control:
    label: "{{ item.item.name }}"
