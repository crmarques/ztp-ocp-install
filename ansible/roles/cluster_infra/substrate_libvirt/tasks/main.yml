---
- name: Ensure libvirt host packages and service
  ansible.builtin.import_role:
    name: host_libvirt

- name: Create libvirt storage directory
  ansible.builtin.file:
    path: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record libvirt desired state
  ansible.builtin.copy:
    dest: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu/virtualization.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      type: {{ bootwright_current_cluster.provider.virtualization.type }}
      libvirt:
        network: {{ bootwright_current_cluster.provider.virtualization.libvirt.network }}
        bridge: {{ bootwright_current_cluster.provider.virtualization.libvirt.bridge }}
        egressRestrictedToProxy: {{ bootwright_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool }}
        proxyURL: {{ bootwright_current_cluster.provider.virtualization.libvirt.proxyURL | default('') }}
      defaultNode:
        cpu: {{ bootwright_current_cluster.provider.virtualization.defaultNode.cpu }}
        memoryMiB: {{ bootwright_current_cluster.provider.virtualization.defaultNode.memoryMiB }}
        diskGiB: {{ bootwright_current_cluster.provider.virtualization.defaultNode.diskGiB }}
      nodes:
      {% for node in bootwright_current_cluster.provider.nodes %}
        - name: {{ node.name }}
          role: {{ node.role }}
          hostRef: {{ node.hostRef }}
          ipAddress: {{ node.ipAddress }}
          macAddress: {{ node.macAddress }}
          resources:
            cpu: {{ node.resources.cpu }}
            memoryMiB: {{ node.resources.memoryMiB }}
            diskGiB: {{ node.resources.diskGiB }}
      {% endfor %}

- name: List libvirt networks
  community.libvirt.virt_net:
    command: list_nets
  register: bootwright_libvirt_net_list
  changed_when: false

- name: Check target libvirt network
  ansible.builtin.set_fact:
    bootwright_libvirt_net_exists: "{{ bootwright_current_cluster.provider.virtualization.libvirt.network in (bootwright_libvirt_net_list.list_nets | default([])) }}"
  changed_when: false

- name: Read live libvirt network XML
  community.libvirt.virt_net:
    command: get_xml
    name: "{{ bootwright_current_cluster.provider.virtualization.libvirt.network }}"
  register: bootwright_libvirt_net_existing_xml
  failed_when: false
  changed_when: false
  when: bootwright_libvirt_net_exists

- name: Select libvirt network UUID
  ansible.builtin.set_fact:
    bootwright_libvirt_net_uuid: >-
      {{
        ((bootwright_libvirt_net_existing_xml.get_xml | default(''))
          | regex_search('[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'))
        if bootwright_libvirt_net_exists
        else (bootwright_current_cluster.name ~ '-net-' ~ bootwright_current_cluster.provider.virtualization.libvirt.network) | to_uuid
      }}
  changed_when: false

- name: Select machine network
  ansible.builtin.set_fact:
    bootwright_libvirt_machine_network: >-
      {{
        (bootwright_current_cluster.network.machineNetworks
          | selectattr('libvirt', 'defined')
          | selectattr('libvirt.bridge', 'equalto', bootwright_current_cluster.provider.virtualization.libvirt.bridge)
          | list
          | first)
        | default(bootwright_current_cluster.network.machineNetworks | first)
      }}
  changed_when: false

- name: Compute libvirt network fingerprint
  ansible.builtin.set_fact:
    bootwright_libvirt_net_fingerprint: >-
      {{
        ([
          bootwright_libvirt_machine_network.gateway,
          bootwright_libvirt_machine_network.cidr,
          bootwright_current_cluster.provider.virtualization.libvirt.bridge,
          (bootwright_current_cluster.provider.virtualization.libvirt.dnsHosts | default([])),
          (bootwright_current_cluster.provider.nodes | default([])
            | map(attribute='macAddress') | list),
          (bootwright_current_cluster.provider.nodes | default([])
            | map(attribute='ipAddress') | list),
          (bootwright_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool),
          'no-hosts',
        ] | to_json) | hash('sha1')
      }}
  changed_when: false

- name: Render libvirt network XML
  ansible.builtin.template:
    src: network.xml.j2
    dest: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu/network.xml"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_libvirt_net_xml_file

- name: Read rendered libvirt network XML
  ansible.builtin.slurp:
    src: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu/network.xml"
  register: bootwright_libvirt_net_xml_slurp

- name: Select rendered libvirt network XML content
  ansible.builtin.set_fact:
    bootwright_libvirt_net_xml_content: "{{ bootwright_libvirt_net_xml_slurp.content | b64decode }}"
  changed_when: false

- name: Detect libvirt network drift
  ansible.builtin.set_fact:
    bootwright_libvirt_net_drifted: >-
      {{
        bootwright_libvirt_net_exists
        and ('bootwright-net-fingerprint:' ~ bootwright_libvirt_net_fingerprint)
            not in (bootwright_libvirt_net_existing_xml.get_xml | default(''))
      }}
  changed_when: false

- name: Remove conflicting libvirt bridges
  when: not bootwright_libvirt_net_exists
  block:
    - name: Read XML for every other libvirt network
      community.libvirt.virt_net:
        command: get_xml
        name: "{{ item }}"
      register: bootwright_libvirt_other_net_xmls
      loop: "{{ (bootwright_libvirt_net_list.list_nets | default([])) | reject('equalto', bootwright_current_cluster.provider.virtualization.libvirt.network) | list }}"
      failed_when: false
      changed_when: false

    - name: Resolve libvirt networks claiming this bridge
      ansible.builtin.set_fact:
        bootwright_libvirt_conflicting_nets: >-
          {{
            bootwright_libvirt_other_net_xmls.results
            | default([])
            | selectattr('get_xml', 'defined')
            | selectattr('get_xml', 'search', "<bridge name='" ~ bootwright_current_cluster.provider.virtualization.libvirt.bridge ~ "'")
            | map(attribute='item')
            | list
          }}
      changed_when: false

    - name: Stop and undefine conflicting libvirt networks
      community.libvirt.virt_net:
        name: "{{ item }}"
        state: absent
      loop: "{{ bootwright_libvirt_conflicting_nets }}"
      failed_when: false

- name: Stop changed libvirt network
  community.libvirt.virt_net:
    name: "{{ bootwright_current_cluster.provider.virtualization.libvirt.network }}"
    state: inactive
  when:
    - bootwright_libvirt_net_exists
    - bootwright_libvirt_net_xml_file.changed or bootwright_libvirt_net_drifted | bool

- name: Define libvirt network
  community.libvirt.virt_net:
    name: "{{ bootwright_current_cluster.provider.virtualization.libvirt.network }}"
    state: present
    xml: "{{ bootwright_libvirt_net_xml_content }}"

- name: Enable libvirt network autostart
  community.libvirt.virt_net:
    name: "{{ bootwright_current_cluster.provider.virtualization.libvirt.network }}"
    autostart: true

- name: Start libvirt network
  community.libvirt.virt_net:
    name: "{{ bootwright_current_cluster.provider.virtualization.libvirt.network }}"
    state: active

- name: Check firewalld state
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --state
  register: bootwright_firewalld_state
  changed_when: false
  failed_when: false

- name: Assign bridge to libvirt firewalld zone
  ansible.posix.firewalld:
    zone: libvirt
    interface: "{{ bootwright_current_cluster.provider.virtualization.libvirt.bridge }}"
    state: enabled
    permanent: true
    immediate: true
  when:
    - bootwright_firewalld_state.rc == 0
    - (bootwright_current_cluster.provider.bootArtifactsHttp.enabled | default(false) | bool) or (bootwright_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool)

- name: Open boot artifact HTTP port
  ansible.posix.firewalld:
    zone: libvirt
    port: "{{ bootwright_current_cluster.provider.bootArtifactsHttp.port | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when:
    - bootwright_firewalld_state.rc == 0
    - bootwright_current_cluster.provider.bootArtifactsHttp.enabled | default(false) | bool

- name: Open managed proxy port
  ansible.posix.firewalld:
    zone: libvirt
    port: "{{ bootwright_current_cluster.provider.virtualization.libvirt.proxyPort | int }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when:
    - bootwright_firewalld_state.rc == 0
    - bootwright_current_cluster.provider.virtualization.libvirt.egressRestrictedToProxy | default(false) | bool
    - (bootwright_current_cluster.provider.virtualization.libvirt.proxyPort | default(0) | int) > 0

- name: Check QEMU emulator candidates
  ansible.builtin.stat:
    path: "{{ item }}"
  register: bootwright_qemu_emulator_candidate_stats
  loop:
    - /usr/bin/qemu-kvm
    - /usr/libexec/qemu-kvm
    - /usr/bin/qemu-system-x86_64

- name: Select QEMU emulator
  ansible.builtin.set_fact:
    bootwright_qemu_emulator_path: "{{ bootwright_qemu_emulator_candidate_stats.results | selectattr('stat.exists') | map(attribute='item') | first | default('') }}"

- name: Validate QEMU emulator
  ansible.builtin.fail:
    msg: "No QEMU emulator found. Expected one of: /usr/bin/qemu-kvm, /usr/libexec/qemu-kvm, /usr/bin/qemu-system-x86_64"
  when: bootwright_qemu_emulator_path == ""

- name: Create VM directories
  ansible.builtin.file:
    path: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ bootwright_current_cluster.provider.nodes }}"

- name: Create VM disks
  ansible.builtin.command:
    argv:
      - qemu-img
      - create
      - -f
      - qcow2
      - "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu/{{ item.name }}/disk.qcow2"
      - "{{ item.resources.diskGiB }}G"
  args:
    creates: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu/{{ item.name }}/disk.qcow2"
  loop: "{{ bootwright_current_cluster.provider.nodes }}"

- name: Read live libvirt domain XML
  community.libvirt.virt:
    command: get_xml
    name: "{{ bootwright_current_cluster.name }}-{{ item.name }}"
  register: bootwright_qemu_domain_xmls
  failed_when: false
  changed_when: false
  loop: "{{ bootwright_current_cluster.provider.nodes }}"

- name: Select libvirt domain UUIDs
  ansible.builtin.set_fact:
    bootwright_qemu_node_uuids: >-
      {{
        bootwright_qemu_node_uuids | default({}) | combine({
          item.item.name: (
            (item.get_xml | default('') | regex_search('[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'))
            if (item.get_xml | default('') | length) > 0
            else (bootwright_current_cluster.name ~ '-' ~ item.item.name) | to_uuid
          )
        })
      }}
  loop: "{{ bootwright_qemu_domain_xmls.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Render VM domain XML
  ansible.builtin.template:
    src: domain.xml.j2
    dest: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu/{{ item.name }}/domain.xml"
    owner: root
    group: root
    mode: "0644"
  vars:
    bootwright_qemu_node: "{{ item }}"
  loop: "{{ bootwright_current_cluster.provider.nodes }}"

- name: Read rendered VM domain XML
  ansible.builtin.slurp:
    src: "{{ bootwright_host_state_dir }}/{{ bootwright_current_cluster.name }}/qemu/{{ item.name }}/domain.xml"
  register: bootwright_qemu_domain_xml_slurp
  loop: "{{ bootwright_current_cluster.provider.nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Define libvirt domains
  community.libvirt.virt:
    command: define
    xml: "{{ item.content | b64decode }}"
  loop: "{{ bootwright_qemu_domain_xml_slurp.results }}"
  loop_control:
    label: "{{ item.item.name }}"
