---
- name: Resolve generated certificate paths
  ansible.builtin.set_fact:
    gitups_generated_certificate_path: "{{ gitups_generated_secret.path }}"
    gitups_generated_private_key_path: "{{ gitups_generated_secret.path }}.key"
  changed_when: false

- name: Stat generated certificate
  ansible.builtin.stat:
    path: "{{ gitups_generated_certificate_path }}"
  register: gitups_generated_certificate_stat

- name: Stat generated certificate private key
  ansible.builtin.stat:
    path: "{{ gitups_generated_private_key_path }}"
  register: gitups_generated_private_key_stat

- name: Fail when generated certificate material is partial
  ansible.builtin.fail:
    msg: >-
      generated self-signed certificate {{ gitups_generated_secret.name }} is
      partially present; expected both {{ gitups_generated_certificate_path }}
      and {{ gitups_generated_private_key_path }}
  when: gitups_generated_certificate_stat.stat.exists != gitups_generated_private_key_stat.stat.exists

- name: Generate self-signed certificate material
  when: not gitups_generated_certificate_stat.stat.exists
  block:
    - name: Generate self-signed certificate private key
      community.crypto.openssl_privatekey:
        path: "{{ gitups_generated_private_key_path }}"
        type: RSA
        size: 4096
        mode: "0600"

    - name: Generate self-signed certificate signing request
      community.crypto.openssl_csr:
        path: "{{ gitups_generated_private_key_path }}.csr"
        privatekey_path: "{{ gitups_generated_private_key_path }}"
        common_name: "{{ gitups_generated_secret.selfSignedCertificate.commonName }}"
        subject_alt_name: "{{ gitups_generated_secret.selfSignedCertificate.subjectAltName.split(',') | map('trim') | list }}"
        mode: "0600"

    - name: Issue self-signed certificate
      community.crypto.x509_certificate:
        path: "{{ gitups_generated_certificate_path }}"
        privatekey_path: "{{ gitups_generated_private_key_path }}"
        csr_path: "{{ gitups_generated_private_key_path }}.csr"
        provider: selfsigned
        selfsigned_digest: sha256
        selfsigned_not_after: "+{{ gitups_generated_secret.selfSignedCertificate.validityDays }}d"
        mode: "0600"

    - name: Remove transient certificate signing request
      ansible.builtin.file:
        path: "{{ gitups_generated_private_key_path }}.csr"
        state: absent

- name: Protect generated certificate material
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ gitups_generated_certificate_path }}"
      mode: "0600"
    - path: "{{ gitups_generated_private_key_path }}"
      mode: "0600"
