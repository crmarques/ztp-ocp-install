---
- name: Resolve cluster-node Redfish target system name
  ansible.builtin.set_fact:
    bootwright_ocp_system_name: "{{ bootwright_current_cluster.name }}-{{ bootwright_ocp_node.name }}"
  changed_when: false

- name: Select Redfish system for cluster node
  ansible.builtin.set_fact:
    bootwright_ocp_system_id: "{{ ((bootwright_ocp_redfish_systems.redfish_facts.system.entries | default([])) | selectattr('Name', 'equalto', bootwright_ocp_system_name) | list | first).Id | default('') }}"
  changed_when: false

- name: Eject virtual media
  community.general.redfish_command:
    category: Systems
    command: VirtualMediaEject
    baseuri: "{{ bootwright_ocp_redfish_baseuri }}"
    username: "{{ bootwright_ocp_bmc_username | default(omit) }}"
    password: "{{ bootwright_ocp_bmc_password | default(omit) }}"
    resource_id: "{{ bootwright_ocp_system_id }}"
    virtual_media:
      image_url: ""
  failed_when: false
  changed_when: false
  when: bootwright_ocp_system_id | length > 0
  no_log: "{{ bootwright_ocp_bmc_auth_enabled }}"
