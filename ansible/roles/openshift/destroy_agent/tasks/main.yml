---
- name: Resolve agent destroy context
  ansible.builtin.set_fact:
    gitups_ocp_installer_dir: "{{ gitups_state_dir }}/{{ gitups_current_cluster.ocp.installer.relativeDir }}"
    gitups_ocp_installer_relative_work: "{{ gitups_current_cluster.ocp.installer.relativeDir }}/work"
    gitups_ocp_provider_bmc: "{{ gitups_current_provider.bmc | default({}) }}"
    gitups_ocp_first_node_name: "{{ (gitups_current_cluster.ocp.nodes | first).name | default('') }}"
    gitups_ocp_bmc_auth_enabled: "{{ (gitups_current_provider.bmc | default({})).auth is defined and (gitups_current_provider.bmc | default({})).auth.credentialRef | default('') | length > 0 }}"
  changed_when: false

- name: Stop stale installer processes
  ansible.builtin.include_role:
    name: process_cleanup
  vars:
    gitups_process_cleanup_pattern: "{{ gitups_ocp_installer_relative_work }}"

- name: Read BMC credential file
  ansible.builtin.slurp:
    src: "{{ gitups_ocp_provider_bmc.auth.credentialRef }}"
  register: gitups_ocp_bmc_credentials_slurp
  no_log: true
  delegate_to: localhost
  become: false
  when: gitups_ocp_bmc_auth_enabled

- name: Parse BMC credentials
  ansible.builtin.set_fact:
    gitups_ocp_bmc_credentials: "{{ gitups_ocp_bmc_credentials_slurp | gitups_parse_credential('cluster BMC credentialRef ' ~ gitups_ocp_provider_bmc.auth.credentialRef) }}"
  no_log: true
  changed_when: false
  when:
    - gitups_ocp_bmc_auth_enabled
    - gitups_ocp_bmc_credentials_slurp.content is defined

- name: Publish BMC auth facts
  ansible.builtin.set_fact:
    gitups_ocp_bmc_username: "{{ gitups_ocp_bmc_credentials.username }}"
    gitups_ocp_bmc_password: "{{ gitups_ocp_bmc_credentials.password }}"
  no_log: true
  changed_when: false
  when:
    - gitups_ocp_bmc_auth_enabled
    - gitups_ocp_bmc_credentials_slurp.content is defined

- name: Resolve Redfish endpoint
  ansible.builtin.set_fact:
    gitups_ocp_redfish_baseuri: "http://127.0.0.1:{{ gitups_ocp_provider_bmc.port }}"
    gitups_ocp_system_name: "{{ gitups_current_cluster.name }}-{{ gitups_ocp_first_node_name }}"
  when: gitups_ocp_provider_bmc.enabled | default(false) | bool
  changed_when: false

- name: List Redfish systems
  community.general.redfish_info:
    category: Systems
    command: GetSystemInventory
    baseuri: "{{ gitups_ocp_redfish_baseuri }}"
    username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    password: "{{ gitups_ocp_bmc_password | default(omit) }}"
  register: gitups_ocp_redfish_systems
  failed_when: false
  changed_when: false
  when:
    - gitups_ocp_redfish_baseuri is defined
    - gitups_ocp_first_node_name | length > 0
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

- name: Select Redfish system
  ansible.builtin.set_fact:
    gitups_ocp_system_id: "{{ ((gitups_ocp_redfish_systems.redfish_facts.system.entries | default([])) | selectattr('Name', 'equalto', gitups_ocp_system_name) | list | first).Id | default('') }}"
  changed_when: false
  when:
    - gitups_ocp_redfish_baseuri is defined
    - gitups_ocp_redfish_systems is defined
    - gitups_ocp_redfish_systems.redfish_facts is defined

- name: Eject virtual media
  community.general.redfish_command:
    category: Systems
    command: VirtualMediaEject
    baseuri: "{{ gitups_ocp_redfish_baseuri }}"
    username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    resource_id: "{{ gitups_ocp_system_id }}"
    virtual_media:
      image_url: ""
  failed_when: false
  changed_when: false
  when:
    - gitups_ocp_redfish_baseuri is defined
    - gitups_ocp_system_id is defined
    - gitups_ocp_system_id | length > 0
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

- name: Remove staged agent ISO
  ansible.builtin.file:
    path: "{{ gitups_host_state_dir }}/providers/{{ gitups_provider_name }}/bmc/vmedia/{{ gitups_current_cluster.name }}-agent.iso"
    state: absent

- name: Remove installer work directory
  ansible.builtin.file:
    path: "{{ gitups_ocp_installer_dir }}/work"
    state: absent
