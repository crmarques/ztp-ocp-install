---
- name: Validate bootwright_state_dir is set
  ansible.builtin.assert:
    that:
      - bootwright_state_dir is defined
      - bootwright_state_dir | length > 0
    fail_msg: "bootwright_state_dir is required (bootwright CLI passes it to ansible-playbook)"

- name: Resolve agent install context
  ansible.builtin.set_fact:
    bootwright_ocp_cluster_install: "{{ bootwright_current_cluster.ocp.install }}"
    bootwright_ocp_release: "{{ bootwright_current_cluster.ocp.release }}"
    bootwright_ocp_installer_dir: "{{ bootwright_state_dir }}/{{ bootwright_current_cluster.ocp.installer.relativeDir }}"
    bootwright_ocp_installer_work_dir: "{{ bootwright_state_dir }}/{{ bootwright_current_cluster.ocp.installer.relativeWorkDir }}"
    bootwright_ocp_installer_relative_work: "{{ bootwright_current_cluster.ocp.installer.relativeWorkDir }}"
    bootwright_ocp_install_config_path: "{{ bootwright_state_dir }}/{{ bootwright_current_cluster.ocp.installer.relativeInstallConfigPath }}"
    bootwright_ocp_agent_config_path: "{{ bootwright_state_dir }}/{{ bootwright_current_cluster.ocp.installer.relativeAgentConfigPath }}"
    bootwright_ocp_provider_bmc: "{{ bootwright_current_provider.bmc }}"
    bootwright_ocp_bmc_auth_enabled: "{{ bootwright_current_provider.bmc.auth is defined and bootwright_current_provider.bmc.auth.credentialRef | default('') | length > 0 }}"
    bootwright_ocp_local_registry: "{{ bootwright_current_cluster.ocp.install.localRegistry | default({}) }}"
    bootwright_ocp_release_image_override: "{{ bootwright_current_cluster.ocp.install.releaseImageOverride | default('') }}"
  changed_when: false

- name: Stop stale installer processes
  ansible.builtin.include_role:
    name: process_cleanup
    apply:
      delegate_to: localhost
      become: false
  vars:
    bootwright_process_cleanup_pattern: "{{ bootwright_ocp_installer_relative_work }}"

- name: Read BMC credential file
  ansible.builtin.slurp:
    src: "{{ bootwright_current_provider.bmc.auth.credentialRef }}"
  register: bootwright_ocp_bmc_credentials_slurp
  no_log: true
  delegate_to: localhost
  become: false
  when: bootwright_ocp_bmc_auth_enabled

- name: Parse BMC credentials
  ansible.builtin.set_fact:
    bootwright_ocp_bmc_credentials: "{{ bootwright_ocp_bmc_credentials_slurp | bootwright_parse_credential('cluster BMC credentialRef ' ~ bootwright_current_provider.bmc.auth.credentialRef) }}"
  no_log: true
  changed_when: false
  when: bootwright_ocp_bmc_auth_enabled

- name: Publish BMC auth facts
  ansible.builtin.set_fact:
    bootwright_ocp_bmc_username: "{{ bootwright_ocp_bmc_credentials.username }}"
    bootwright_ocp_bmc_password: "{{ bootwright_ocp_bmc_credentials.password }}"
  no_log: true
  changed_when: false
  when: bootwright_ocp_bmc_auth_enabled

- name: Select generated certificate requests
  ansible.builtin.set_fact:
    bootwright_ocp_generated_self_signed_certificates: "{{ bootwright_ocp_cluster_install.generatedSecrets | default([]) | selectattr('type', 'equalto', 'self-signed-certificate') | list }}"
  changed_when: false

- name: Validate agent install method
  ansible.builtin.fail:
    msg: "install_agent only supports install method 'agent', got '{{ bootwright_ocp_cluster_install.method | default('<unset>') }}'"
  when: (bootwright_ocp_cluster_install.method | default('')) != 'agent'

- name: Locate openshift-install
  ansible.builtin.shell: "command -v {{ bootwright_openshift_install | quote }}"
  args:
    executable: /bin/sh
  register: bootwright_openshift_install_lookup
  changed_when: false
  failed_when: bootwright_openshift_install_lookup.rc != 0
  delegate_to: localhost
  become: false

- name: Resolve openshift-install path
  ansible.builtin.set_fact:
    bootwright_openshift_install_path: "{{ bootwright_openshift_install_lookup.stdout | trim }}"
  changed_when: false

- name: Read openshift-install version
  ansible.builtin.command:
    cmd: "{{ bootwright_openshift_install_path }} version"
  register: bootwright_openshift_install_version
  changed_when: false
  delegate_to: localhost
  become: false

- name: Validate openshift-install release
  ansible.builtin.assert:
    that:
      - bootwright_ocp_release.version | length > 0
      - bootwright_openshift_install_version.stdout_lines[0] is search(bootwright_ocp_release.version)
    fail_msg: |
      openshift-install at {{ bootwright_openshift_install_path }} reports
      "{{ bootwright_openshift_install_version.stdout_lines[0] }}", which does not match
      release.version {{ bootwright_ocp_release.version | default('<unset>') }}.
      Replace the binary or override bootwright_openshift_install.
