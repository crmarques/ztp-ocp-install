---
- name: Validate gitups_state_dir is set
  ansible.builtin.assert:
    that:
      - gitups_state_dir is defined
      - gitups_state_dir | length > 0
    fail_msg: "gitups_state_dir is required (gitups CLI passes it to ansible-playbook)"

- name: Resolve agent install context
  ansible.builtin.set_fact:
    gitups_ocp_cluster_install: "{{ gitups_current_cluster.ocp.install }}"
    gitups_ocp_release: "{{ gitups_current_cluster.ocp.release }}"
    gitups_ocp_installer_dir: "{{ gitups_state_dir }}/{{ gitups_current_cluster.ocp.installer.relativeDir }}"
    gitups_ocp_installer_relative_work: "{{ gitups_current_cluster.ocp.installer.relativeDir }}/work"
    gitups_ocp_install_config_path: "{{ gitups_state_dir }}/{{ gitups_current_cluster.ocp.installer.relativeInstallConfigPath }}"
    gitups_ocp_agent_config_path: "{{ gitups_state_dir }}/{{ gitups_current_cluster.ocp.installer.relativeAgentConfigPath }}"
    gitups_ocp_provider_bmc: "{{ gitups_current_provider.bmc }}"
    gitups_ocp_bmc_auth_enabled: "{{ gitups_current_provider.bmc.auth is defined and gitups_current_provider.bmc.auth.credentialRef | default('') | length > 0 }}"
    gitups_ocp_local_registry: "{{ gitups_current_cluster.ocp.install.localRegistry | default({}) }}"
    gitups_ocp_release_image_override: "{{ gitups_current_cluster.ocp.install.releaseImageOverride | default('') }}"
  changed_when: false

- name: Stop stale installer processes
  ansible.builtin.include_role:
    name: process_cleanup
    apply:
      delegate_to: localhost
      become: false
  vars:
    gitups_process_cleanup_pattern: "{{ gitups_ocp_installer_relative_work }}"

- name: Read BMC credential file
  ansible.builtin.slurp:
    src: "{{ gitups_current_provider.bmc.auth.credentialRef }}"
  register: gitups_ocp_bmc_credentials_slurp
  no_log: true
  delegate_to: localhost
  become: false
  when: gitups_ocp_bmc_auth_enabled

- name: Parse BMC credentials
  ansible.builtin.set_fact:
    gitups_ocp_bmc_credentials: "{{ gitups_ocp_bmc_credentials_slurp | gitups_parse_credential('cluster BMC credentialRef ' ~ gitups_current_provider.bmc.auth.credentialRef) }}"
  no_log: true
  changed_when: false
  when: gitups_ocp_bmc_auth_enabled

- name: Publish BMC auth facts
  ansible.builtin.set_fact:
    gitups_ocp_bmc_username: "{{ gitups_ocp_bmc_credentials.username }}"
    gitups_ocp_bmc_password: "{{ gitups_ocp_bmc_credentials.password }}"
  no_log: true
  changed_when: false
  when: gitups_ocp_bmc_auth_enabled

- name: Select generated certificate requests
  ansible.builtin.set_fact:
    gitups_ocp_generated_self_signed_certificates: "{{ gitups_ocp_cluster_install.generatedSecrets | default([]) | selectattr('type', 'equalto', 'self-signed-certificate') | list }}"
  changed_when: false

- name: Validate agent install method
  ansible.builtin.fail:
    msg: "install_agent only supports install method 'agent', got '{{ gitups_ocp_cluster_install.method | default('<unset>') }}'"
  when: (gitups_ocp_cluster_install.method | default('')) != 'agent'

- name: Locate openshift-install
  ansible.builtin.shell: "command -v {{ gitups_openshift_install | quote }}"
  args:
    executable: /bin/sh
  register: gitups_openshift_install_lookup
  changed_when: false
  failed_when: gitups_openshift_install_lookup.rc != 0
  delegate_to: localhost
  become: false

- name: Resolve openshift-install path
  ansible.builtin.set_fact:
    gitups_openshift_install_path: "{{ gitups_openshift_install_lookup.stdout | trim }}"
  changed_when: false

- name: Read openshift-install version
  ansible.builtin.command:
    cmd: "{{ gitups_openshift_install_path }} version"
  register: gitups_openshift_install_version
  changed_when: false
  delegate_to: localhost
  become: false

- name: Validate openshift-install release
  ansible.builtin.assert:
    that:
      - gitups_ocp_release.version | length > 0
      - gitups_openshift_install_version.stdout_lines[0] is search(gitups_ocp_release.version)
    fail_msg: |
      openshift-install at {{ gitups_openshift_install_path }} reports
      "{{ gitups_openshift_install_version.stdout_lines[0] }}", which does not match
      release.version {{ gitups_ocp_release.version | default('<unset>') }}.
      Replace the binary or override gitups_openshift_install.
