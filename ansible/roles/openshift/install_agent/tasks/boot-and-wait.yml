---
- name: Locate agent ISO
  ansible.builtin.find:
    paths: "{{ bootwright_ocp_installer_work_dir }}"
    patterns: "agent.*.iso"
    file_type: file
  register: bootwright_agent_iso_find
  delegate_to: localhost
  become: false

- name: Validate agent ISO exists
  ansible.builtin.fail:
    msg: "openshift-install did not produce an agent ISO under {{ bootwright_ocp_installer_work_dir }}"
  when: bootwright_agent_iso_find.matched == 0

- name: Select agent ISO path
  ansible.builtin.set_fact:
    bootwright_agent_iso_path: "{{ bootwright_agent_iso_find.files | sort(attribute='mtime', reverse=true) | map(attribute='path') | first }}"
  changed_when: false

- name: Stage agent ISO for BMC boot
  ansible.builtin.copy:
    src: "{{ bootwright_agent_iso_path }}"
    dest: "{{ bootwright_host_state_dir }}/providers/{{ bootwright_provider_name }}/bmc/vmedia/{{ bootwright_current_cluster.name }}-agent.iso"
    owner: root
    group: root
    mode: "0644"
  register: bootwright_agent_iso_stage

- name: Refresh libvirt vmedia pool
  community.libvirt.virt_pool:
    name: "bootwright-{{ bootwright_provider_name }}-vmedia"
    command: refresh
  when:
    - bootwright_agent_iso_stage.changed
    - bootwright_current_provider.bmcRole == 'emulated'

- name: Boot node via BMC
  ansible.builtin.include_role:
    name: "boot_{{ bootwright_current_provider.bmcRole }}"

- name: Wait for agent install completion
  ansible.builtin.command:
    cmd: "{{ bootwright_openshift_install_path }} agent wait-for install-complete --dir {{ bootwright_ocp_installer_work_dir }} --log-level info"
  environment: "{{ bootwright_ocp_install_env }}"
  async: "{{ bootwright_ocp_install_timeout_seconds }}"
  poll: 300
  register: bootwright_ocp_install_wait
  changed_when: bootwright_ocp_install_wait.rc == 0
  delegate_to: localhost
  become: false

- name: Record kubeconfig path
  ansible.builtin.copy:
    dest: "{{ bootwright_ocp_installer_work_dir }}/kubeconfig.path"
    mode: "0600"
    content: "{{ bootwright_ocp_installer_work_dir }}/auth/kubeconfig\n"
  when: bootwright_ocp_install_wait.rc == 0
  delegate_to: localhost
  become: false
