---
- name: Read installer secret files
  delegate_to: localhost
  become: false
  block:
    - name: Validate secrets directory exists
      when: gitups_ocp_generated_self_signed_certificates | length > 0
      block:
        - name: Stat secrets directory
          ansible.builtin.stat:
            path: "{{ gitups_secrets_dir }}"
          register: gitups_secrets_dir_stat

        - name: Fail when secrets directory is missing
          ansible.builtin.fail:
            msg: "secrets directory {{ gitups_secrets_dir }} does not exist"
          when: not gitups_secrets_dir_stat.stat.exists or not gitups_secrets_dir_stat.stat.isdir

    - name: Stat requested generated self-signed certificate material
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ gitups_ocp_generated_self_signed_certificates }}"
      loop_control:
        label: "{{ item.name }}"
      register: gitups_generated_certificate_stats

    - name: Fail when generated self-signed certificate material is missing
      ansible.builtin.fail:
        msg: >-
          generated certificate {{ item.item.name }} is missing at
          {{ item.item.path }}; run `gitups secrets generate`
          before apply so user-home secret material stays user-owned.
      loop: "{{ gitups_generated_certificate_stats.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not item.stat.exists or not item.stat.isreg

    - name: Read pull secret material
      ansible.builtin.slurp:
        src: "{{ gitups_ocp_cluster_install.pullSecretRef }}"
      register: gitups_pull_secret_slurp
      no_log: true

    - name: Read SSH public key material
      ansible.builtin.slurp:
        src: "{{ gitups_ocp_cluster_install.sshKeyRef }}"
      register: gitups_ssh_key_slurp
      no_log: true

    - name: Read additional trust bundle material
      ansible.builtin.slurp:
        src: "{{ gitups_ocp_cluster_install.additionalTrustBundleRef }}"
      register: gitups_trust_bundle_slurp
      no_log: true
      when: (gitups_ocp_cluster_install.additionalTrustBundleRef | default('')) | length > 0

- name: Decode installer secrets
  ansible.builtin.set_fact:
    gitups_resolved_pull_secret: "{{ gitups_pull_secret_slurp.content | b64decode | trim }}"
    gitups_resolved_ssh_key: "{{ gitups_ssh_key_slurp.content | b64decode | trim }}"
    gitups_resolved_trust_bundle: "{{ (gitups_trust_bundle_slurp.content | default('') | b64decode) if (gitups_ocp_cluster_install.additionalTrustBundleRef | default('')) | length > 0 else '' }}"
  no_log: true
  changed_when: false

- name: Validate pull secret
  ansible.builtin.assert:
    that:
      - (gitups_resolved_pull_secret | from_json).auths is mapping
    fail_msg: "pull secret at {{ gitups_ocp_cluster_install.pullSecretRef }} is not valid JSON with .auths"

- name: Read mirror registry credentials
  ansible.builtin.slurp:
    src: "{{ gitups_ocp_local_registry.registry.credentialsRef }}"
  register: gitups_mirror_credentials_slurp
  no_log: true
  delegate_to: localhost
  become: false
  when: gitups_ocp_local_registry | length > 0

- name: Build mirror registry pull-secret auth
  ansible.builtin.set_fact:
    gitups_mirror_pull_secret_auth: >-
      {{
        {
          gitups_ocp_local_registry.registry.url: {
            'auth': (gitups_mirror_credentials_slurp.content | b64decode | trim) | b64encode,
          }
        }
      }}
  no_log: true
  changed_when: false
  when: gitups_ocp_local_registry | length > 0

- name: Merge mirror auth into pull secret
  ansible.builtin.set_fact:
    gitups_resolved_pull_secret: >-
      {{
        (gitups_resolved_pull_secret | from_json)
        | combine({'auths': gitups_mirror_pull_secret_auth | combine((gitups_resolved_pull_secret | from_json).auths | default({}))})
        | to_json
      }}
  no_log: true
  changed_when: false
  when: gitups_ocp_local_registry | length > 0
