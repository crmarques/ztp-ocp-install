---
# Plumb managed load balancer VIPs onto their cluster bridge so the addresses
# answer ARP. ip_nonlocal_bind lets HAProxy listen on a non-local IP, but
# without an interface owning it neither the cluster nodes nor the host can
# reach the listener — the installer then loops on
# "Bootstrap Kube API never initialized" while bootkube actually runs fine on
# the SNO node, because traffic to the API VIP never arrives.

- name: Resolve managed load balancer VIP attachments
  ansible.builtin.set_fact:
    gitups_managed_lb_vips: >-
      {{
        gitups_current_load_balancers
        | map(attribute='frontends') | flatten
        | map(attribute='bindings') | flatten
        | selectattr('bridgeAttachment', 'defined')
        | rejectattr('bridgeAttachment', 'equalto', None)
        | list
      }}
  changed_when: false

- name: Compute unique VIP attachments to plumb
  ansible.builtin.set_fact:
    gitups_managed_lb_vip_targets: >-
      {{
        gitups_managed_lb_vips
        | map('to_json') | unique | map('from_json') | list
      }}
  changed_when: false

# A bridge attachment can refer to a bridge that lives on another host (when
# the LB and the libvirt network are split across hosts). Skip silently for
# those — the host that owns the bridge plumbs them when this role runs there.
- name: Check bridge presence for each VIP target
  ansible.builtin.command:
    argv:
      - ip
      - -br
      - link
      - show
      - "{{ item.bridgeAttachment.bridge }}"
  register: gitups_managed_lb_bridge_check
  changed_when: false
  failed_when: false
  loop: "{{ gitups_managed_lb_vip_targets }}"
  loop_control:
    label: "{{ item.bindAddress }} on {{ item.bridgeAttachment.bridge }}"

- name: Resolve VIP targets reachable from this host
  ansible.builtin.set_fact:
    gitups_managed_lb_local_vips: >-
      {{
        gitups_managed_lb_bridge_check.results
        | default([])
        | selectattr('rc', 'equalto', 0)
        | map(attribute='item')
        | list
      }}
  changed_when: false

# `ip address add` returns rc=2 with "File exists" when the address already
# lives on the interface; treat that as success so re-runs stay idempotent.
- name: Plumb managed load balancer VIPs onto the cluster bridge
  ansible.builtin.command:
    argv:
      - ip
      - address
      - add
      - "{{ item.bindAddress }}/{{ item.bridgeAttachment.prefixLength }}"
      - dev
      - "{{ item.bridgeAttachment.bridge }}"
  register: gitups_managed_lb_vip_plumb
  changed_when: gitups_managed_lb_vip_plumb.rc == 0
  failed_when:
    - gitups_managed_lb_vip_plumb.rc != 0
    - "'File exists' not in (gitups_managed_lb_vip_plumb.stderr | default(''))"
  loop: "{{ gitups_managed_lb_local_vips }}"
  loop_control:
    label: "{{ item.bindAddress }}/{{ item.bridgeAttachment.prefixLength }} dev {{ item.bridgeAttachment.bridge }}"
