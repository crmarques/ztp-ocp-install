---
# Booting the OCP cluster node via Redfish: power off, eject prior media, insert
# the agent ISO, power back on. Selected by ocp_install_agent through dynamic
# include_role on `ocp_boot_{{ provider.bmcRole }}`. Both provider_bmc_emulated
# (sushy-tools loopback) and provider_bmc_redfish (real BMC) expose the same
# Redfish surface, so this role serves both.
#
# Inputs (set by ocp_install_agent before include_role):
#   gitups_ocp_provider_bmc          → ProviderBMCVars (port, bindAddress, auth)
#   gitups_ocp_bmc_auth_enabled      → bool
#   gitups_ocp_bmc_username/password → resolved if auth_enabled
#   gitups_current_cluster           → ClusterVars (used to compute system name)
#   gitups_current_provider          → ProviderComponentVars (bmc.port for ISO URL)

# Loopback HTTP probes are simple readiness checks; the Redfish API
# tasks below carry the semantic protocol calls.
- name: Wait for Redfish endpoint readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitups_ocp_provider_bmc.port }}/redfish/v1/Systems"
    method: GET
    status_code: 200
    return_content: false
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  register: gitups_ocp_redfish_ready
  retries: 30
  delay: 2
  until: gitups_ocp_redfish_ready.status == 200
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

# sushy-tools fetches the InsertMedia Image over HTTP from the loopback
# vmedia server provider_bmc_emulated stands up on bmc.port + 1. If that
# unit is missing, InsertMedia returns Base.1.0.GeneralError with a
# connection-refused cause; fail fast here with a clearer signal.
- name: Wait for vmedia HTTP server readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitups_ocp_provider_bmc.port | int + 1 }}/"
    method: GET
    status_code: 200
    return_content: false
  register: gitups_ocp_vmedia_http
  retries: 30
  delay: 2
  until: gitups_ocp_vmedia_http.status == 200

- name: Resolve cluster-node Redfish base URL and target system name
  ansible.builtin.set_fact:
    gitups_ocp_redfish_baseuri: "http://127.0.0.1:{{ gitups_ocp_provider_bmc.port }}"
    gitups_ocp_system_name: "{{ gitups_current_cluster.name }}-{{ (gitups_current_cluster.ocp.nodes | first).name }}"
  changed_when: false

# community.general.redfish_{info,command} hardcode an `https://` prefix
# on baseuri (redfish_utils root_uri = "https://" + baseuri), so they
# cannot drive the loopback sushy-emulator that serves plain HTTP. Drive
# the Redfish API directly via ansible.builtin.uri instead.
- name: Enumerate Redfish systems
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}/redfish/v1/Systems"
    method: GET
    return_content: true
    body_format: json
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  register: gitups_ocp_redfish_systems
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

- name: Fetch Redfish system details
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}{{ item['@odata.id'] }}"
    method: GET
    return_content: true
    body_format: json
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  loop: "{{ gitups_ocp_redfish_systems.json.Members }}"
  register: gitups_ocp_redfish_system_details
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

- name: Resolve cluster-node Redfish system entry by name
  ansible.builtin.set_fact:
    gitups_ocp_system_entry: >-
      {{ (gitups_ocp_redfish_system_details.results
          | map(attribute='json')
          | selectattr('Name', 'equalto', gitups_ocp_system_name)
          | list | first) }}
  changed_when: false

# sushy-tools exposes VirtualMedia under the ComputerSystem resource, not
# under the Manager (despite the Redfish spec putting it under Managers in
# many vendor implementations). Discover the collection URI from the
# system entry rather than constructing it from the manager URI.
- name: Resolve cluster-node Redfish system identifiers
  ansible.builtin.set_fact:
    gitups_ocp_system_id: "{{ gitups_ocp_system_entry.Id }}"
    gitups_ocp_system_power: "{{ gitups_ocp_system_entry.PowerState | default('Off') }}"
    gitups_ocp_system_uri: "{{ gitups_ocp_system_entry['@odata.id'] }}"
    gitups_ocp_system_reset_uri: "{{ gitups_ocp_system_entry.Actions['#ComputerSystem.Reset'].target }}"
    gitups_ocp_vmedia_collection_uri: "{{ gitups_ocp_system_entry.VirtualMedia['@odata.id'] }}"
  changed_when: false

- name: Power off cluster node before inserting agent media
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}{{ gitups_ocp_system_reset_uri }}"
    method: POST
    body_format: json
    body:
      ResetType: ForceOff
    status_code: [200, 202, 204]
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  when: gitups_ocp_system_power != 'Off'
  register: gitups_ocp_power_off
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

- name: Wait for cluster node to report Off
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}{{ gitups_ocp_system_uri }}"
    method: GET
    return_content: true
    body_format: json
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  register: gitups_ocp_redfish_off_check
  retries: 20
  delay: 2
  until: gitups_ocp_redfish_off_check.json.PowerState == 'Off'
  when: gitups_ocp_power_off.changed | default(false)
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

- name: List cluster-node system virtual media slots
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}{{ gitups_ocp_vmedia_collection_uri }}"
    method: GET
    return_content: true
    body_format: json
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  register: gitups_ocp_vmedia_list
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

- name: Fetch cluster-node virtual media slot details
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}{{ item['@odata.id'] }}"
    method: GET
    return_content: true
    body_format: json
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  loop: "{{ gitups_ocp_vmedia_list.json.Members }}"
  register: gitups_ocp_vmedia_details
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

# json_query (jmespath) would let us filter on `MediaTypes contains CD`,
# but jmespath isn't a guaranteed dep on the controller. sushy-tools
# always names its optical slot `Cd`, so an Id-equality selectattr is
# both portable (no extra deps) and accurate for this emulator.
- name: Resolve cluster-node CD virtual media slot
  ansible.builtin.set_fact:
    gitups_ocp_vmedia_cd: >-
      {{ (gitups_ocp_vmedia_details.results
          | map(attribute='json')
          | selectattr('Id', 'equalto', 'Cd')
          | list | first) }}
  changed_when: false

- name: Eject any previously-inserted virtual media
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}{{ gitups_ocp_vmedia_cd.Actions['#VirtualMedia.EjectMedia'].target }}"
    method: POST
    body_format: json
    body: {}
    status_code: [200, 202, 204]
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  failed_when: false
  changed_when: false
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

- name: Insert agent ISO via Redfish virtual media
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}{{ gitups_ocp_vmedia_cd.Actions['#VirtualMedia.InsertMedia'].target }}"
    method: POST
    body_format: json
    body:
      Image: "http://127.0.0.1:{{ gitups_ocp_provider_bmc.port | int + 1 }}/{{ gitups_current_cluster.name }}-agent.iso"
      Inserted: true
    status_code: [200, 202, 204]
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"

# cluster_substrate_libvirt renders the libvirt domain XML with OS-level
# <boot dev='hd'/><boot dev='cdrom'/>, so SeaBIOS falls through to the
# cdrom on first boot (empty disk) and prefers disk after install. Per-
# device <boot order> is avoided because sushy-tools InsertMedia rewrites
# the cdrom block on the running domain and strips the order attribute,
# leaving only the empty disk bootable.

# YAML 1.1 coerces bare On/Off/Yes/No to booleans -- ResetType must stay
# a string, so the value is quoted explicitly.
- name: Power on cluster node
  ansible.builtin.uri:
    url: "{{ gitups_ocp_redfish_baseuri }}{{ gitups_ocp_system_reset_uri }}"
    method: POST
    body_format: json
    body:
      ResetType: "On"
    status_code: [200, 202, 204]
    url_username: "{{ gitups_ocp_bmc_username | default(omit) }}"
    url_password: "{{ gitups_ocp_bmc_password | default(omit) }}"
    force_basic_auth: "{{ gitups_ocp_bmc_auth_enabled }}"
  no_log: "{{ gitups_ocp_bmc_auth_enabled }}"
