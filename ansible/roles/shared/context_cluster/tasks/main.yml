---
- name: Select cluster for this host
  ansible.builtin.set_fact:
    gitups_current_cluster: "{{ gitups_clusters | selectattr('name', 'equalto', gitups_cluster_name) | first }}"
  changed_when: false

- name: Assert cluster context resolved
  ansible.builtin.assert:
    that:
      - gitups_current_cluster is mapping
      - (gitups_current_cluster.name | default('')) == gitups_cluster_name
    fail_msg: >-
      gitups_cluster_name={{ gitups_cluster_name }} did not match any entry in
      gitups_clusters. Available names: {{ gitups_clusters | default([]) | map(attribute='name') | list }}.
      Check that render projected the cluster you scoped to.

- name: Select provider for this host
  ansible.builtin.set_fact:
    gitups_current_provider: "{{ gitups_providers | selectattr('name', 'equalto', gitups_provider_name) | first }}"
  changed_when: false
  when: gitups_provider_name is defined

- name: Assert provider context resolved
  ansible.builtin.assert:
    that:
      - gitups_current_provider is mapping
      - (gitups_current_provider.name | default('')) == gitups_provider_name
    fail_msg: >-
      gitups_provider_name={{ gitups_provider_name }} did not match any entry in
      gitups_providers. Available names: {{ gitups_providers | default([]) | map(attribute='name') | list }}.
  when: gitups_provider_name is defined

- name: Publish cluster context facts
  ansible.builtin.set_fact:
    gitups_cluster_ctx:
      cluster: "{{ gitups_current_cluster }}"
      provider: "{{ gitups_current_provider | default(None) }}"
  changed_when: false
