---
- name: Select cluster for this host
  ansible.builtin.set_fact:
    bootwright_current_cluster: "{{ bootwright_clusters | selectattr('name', 'equalto', bootwright_cluster_name) | first }}"
  changed_when: false

- name: Assert cluster context resolved
  ansible.builtin.assert:
    that:
      - bootwright_current_cluster is mapping
      - (bootwright_current_cluster.name | default('')) == bootwright_cluster_name
    fail_msg: >-
      bootwright_cluster_name={{ bootwright_cluster_name }} did not match any entry in
      bootwright_clusters. Available names: {{ bootwright_clusters | default([]) | map(attribute='name') | list }}.
      Check that render projected the cluster you scoped to.

- name: Select provider for this host
  ansible.builtin.set_fact:
    bootwright_current_provider: "{{ bootwright_providers | selectattr('name', 'equalto', bootwright_provider_name) | first }}"
  changed_when: false
  when: bootwright_provider_name is defined

- name: Assert provider context resolved
  ansible.builtin.assert:
    that:
      - bootwright_current_provider is mapping
      - (bootwright_current_provider.name | default('')) == bootwright_provider_name
    fail_msg: >-
      bootwright_provider_name={{ bootwright_provider_name }} did not match any entry in
      bootwright_providers. Available names: {{ bootwright_providers | default([]) | map(attribute='name') | list }}.
  when: bootwright_provider_name is defined

- name: Publish cluster context facts
  ansible.builtin.set_fact:
    bootwright_cluster_ctx:
      cluster: "{{ bootwright_current_cluster }}"
      provider: "{{ bootwright_current_provider | default(None) }}"
  changed_when: false
