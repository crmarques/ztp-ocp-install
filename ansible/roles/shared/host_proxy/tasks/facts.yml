---
- name: Resolve proxy desired state
  ansible.builtin.set_fact:
    bootwright_proxy_enabled: "{{ (bootwright_proxy_http | length) > 0 or (bootwright_proxy_https | length) > 0 }}"
  changed_when: false

- name: Read proxy credential file
  ansible.builtin.slurp:
    src: "{{ bootwright_proxy_credentials_ref }}"
  register: bootwright_proxy_credentials_slurp
  no_log: true
  delegate_to: localhost
  become: false
  when:
    - bootwright_proxy_enabled
    - (bootwright_proxy_credentials_ref | length) > 0

- name: Parse proxy credentials
  ansible.builtin.set_fact:
    bootwright_proxy_credentials: "{{ bootwright_proxy_credentials_slurp | bootwright_parse_credential('ocpInstall proxy credentialsRef ' ~ bootwright_proxy_credentials_ref) }}"
  no_log: true
  changed_when: false
  when:
    - bootwright_proxy_enabled
    - (bootwright_proxy_credentials_ref | length) > 0

- name: Build credentialed proxy URLs
  ansible.builtin.set_fact:
    bootwright_proxy_authority: >-
      {{
        (bootwright_proxy_credentials.username | urlencode | replace('/', '%2F')) ~ ':' ~
        (bootwright_proxy_credentials.password | urlencode | replace('/', '%2F')) ~ '@'
        if (bootwright_proxy_credentials_ref | length) > 0
        else ''
      }}
  no_log: true
  changed_when: false
  when: bootwright_proxy_enabled

- name: Select effective proxy URLs
  ansible.builtin.set_fact:
    bootwright_proxy_http_effective: >-
      {{
        bootwright_proxy_http | regex_replace('^([a-zA-Z][a-zA-Z0-9+.-]*://)([^@/]+@)?', '\1' ~ bootwright_proxy_authority)
        if (bootwright_proxy_http | length) > 0 else ''
      }}
    bootwright_proxy_https_effective: >-
      {{
        bootwright_proxy_https | regex_replace('^([a-zA-Z][a-zA-Z0-9+.-]*://)([^@/]+@)?', '\1' ~ bootwright_proxy_authority)
        if (bootwright_proxy_https | length) > 0 else ''
      }}
    bootwright_proxy_vm_http_effective: >-
      {{
        bootwright_proxy_vm_http | regex_replace('^([a-zA-Z][a-zA-Z0-9+.-]*://)([^@/]+@)?', '\1' ~ bootwright_proxy_authority)
        if (bootwright_proxy_vm_http | length) > 0 else ''
      }}
    bootwright_proxy_vm_https_effective: >-
      {{
        bootwright_proxy_vm_https | regex_replace('^([a-zA-Z][a-zA-Z0-9+.-]*://)([^@/]+@)?', '\1' ~ bootwright_proxy_authority)
        if (bootwright_proxy_vm_https | length) > 0 else ''
      }}
  no_log: true
  changed_when: false
  when: bootwright_proxy_enabled

- name: Select primary proxy URL
  ansible.builtin.set_fact:
    bootwright_proxy_primary: "{{ bootwright_proxy_https_effective if (bootwright_proxy_https_effective | length) > 0 else bootwright_proxy_http_effective }}"
  no_log: true
  changed_when: false
  when: bootwright_proxy_enabled

# When disabled, blank the env vars explicitly (not {}) to override stale
# HTTP(S)_PROXY exports inherited from sshd/systemd of a prior enabled run.
- name: Build proxy environment facts
  ansible.builtin.set_fact:
    bootwright_proxy_env: >-
      {{
        {
          'HTTP_PROXY': bootwright_proxy_http_effective,
          'HTTPS_PROXY': bootwright_proxy_https_effective,
          'NO_PROXY': bootwright_proxy_no,
          'http_proxy': bootwright_proxy_http_effective,
          'https_proxy': bootwright_proxy_https_effective,
          'no_proxy': bootwright_proxy_no,
        } if bootwright_proxy_enabled else {
          'HTTP_PROXY': '',
          'HTTPS_PROXY': '',
          'NO_PROXY': '',
          'http_proxy': '',
          'https_proxy': '',
          'no_proxy': '',
        }
      }}
  no_log: true
  changed_when: false
