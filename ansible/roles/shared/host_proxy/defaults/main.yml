---
# Two-URL proxy model (see internal/provisioning/render/proxy.go): http/https are
# host-facing; vmHttp/vmHttps are VM-facing (libvirt-bridge gateway).
bootwright_proxy_http: "{{ (bootwright_ocp_install.proxy | default({})).http | default('') }}"
bootwright_proxy_https: "{{ (bootwright_ocp_install.proxy | default({})).https | default('') }}"
bootwright_proxy_vm_http: "{{ (bootwright_ocp_install.proxy | default({})).vmHttp | default((bootwright_ocp_install.proxy | default({})).http | default('')) }}"
bootwright_proxy_vm_https: "{{ (bootwright_ocp_install.proxy | default({})).vmHttps | default((bootwright_ocp_install.proxy | default({})).https | default('')) }}"
bootwright_proxy_no: "{{ (bootwright_ocp_install.proxy | default({})).noProxy | default([]) | join(',') }}"
bootwright_proxy_credentials_ref: "{{ (bootwright_ocp_install.proxy | default({})).proxyAuthRef | default('') }}"

bootwright_secrets_dir: "{{ lookup('env', 'BOOTWRIGHT_SECRETS_DIR') | default((lookup('env', 'BOOTWRIGHT_USER_DIR') | default(lookup('env', 'HOME') ~ '/.bootwright', true)) ~ '/secrets', true) }}"
