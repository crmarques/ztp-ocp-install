---
- name: Select provider for this host
  ansible.builtin.set_fact:
    bootwright_current_provider: "{{ bootwright_providers | selectattr('name', 'equalto', bootwright_provider_name) | first }}"
  changed_when: false

- name: Assert provider context resolved
  ansible.builtin.assert:
    that:
      - bootwright_current_provider is mapping
      - (bootwright_current_provider.name | default('')) == bootwright_provider_name
    fail_msg: >-
      bootwright_provider_name={{ bootwright_provider_name }} did not match any entry in
      bootwright_providers. Available names: {{ bootwright_providers | default([]) | map(attribute='name') | list }}.
      Check that render projected this provider for the host {{ bootwright_host_name | default('?') }}.

- name: Select load balancers on this host
  ansible.builtin.set_fact:
    bootwright_current_load_balancers: "{{ bootwright_load_balancers | selectattr('providerRef', 'equalto', bootwright_provider_name) | selectattr('placement.providerHostRef', 'equalto', bootwright_host_name) | list }}"
  changed_when: false

- name: Select mirror registry on this host
  ansible.builtin.set_fact:
    bootwright_current_mirror_registry: "{{ (bootwright_mirror_registries | default([]) | selectattr('providerRef', 'equalto', bootwright_provider_name) | selectattr('providerHostRef', 'equalto', bootwright_host_name) | list | first) | default(None) }}"
  changed_when: false

- name: Select managed proxy on this host
  ansible.builtin.set_fact:
    bootwright_current_forward_proxy: "{{ (bootwright_forward_proxies | default([]) | selectattr('providerRef', 'equalto', bootwright_provider_name) | selectattr('providerHostRef', 'equalto', bootwright_host_name) | list | first) | default(None) }}"
  changed_when: false

- name: Publish provider context facts
  ansible.builtin.set_fact:
    bootwright_provider_ctx:
      provider: "{{ bootwright_current_provider }}"
      loadBalancers: "{{ bootwright_current_load_balancers }}"
      mirrorRegistry: "{{ bootwright_current_mirror_registry }}"
      forwardProxy: "{{ bootwright_current_forward_proxy }}"
  changed_when: false
