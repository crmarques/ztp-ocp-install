---
# Provider-scoped role for the IPMI BMC path. Scaffold only — most modern
# bare-metal Redfish BMCs use provider_bmc_redfish; this role exists for
# legacy IPMI-only hardware.

- name: IPMI BMC is not yet implemented
  ansible.builtin.fail:
    msg: |
      provider_bmc_ipmi is a scaffold. To enable, model IPMI endpoints on
      MachineBareMetalSpec.BMC (protocol: ipmi) and implement the ipmitool
      based power/media commands here. Most lab and modern bare metal
      should use provider_bmc_redfish instead.
