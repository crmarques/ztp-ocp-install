---
# Substrate-neutral HTTP server that publishes RHCOS rootfs and other agent
# boot artifacts to nodes. Required for substrates that cannot mount media
# out-of-band (qemu-kvm + emulated BMC, real bare-metal Redfish), skipped for
# substrates that mount via their own API (vSphere, KubeVirt). Inputs come
# from gitups_current_provider.bootArtifactsHttp, computed in vars.go's
# providerDispatch().

- name: Validate boot-artifacts HTTP inputs
  ansible.builtin.assert:
    that:
      - gitups_current_provider.bootArtifactsHttp.port | int > 0
      - (gitups_current_provider.bootArtifactsHttp.bindAddress | default('')) | length > 0
    fail_msg: "provider_boot_artifacts_http requires bootArtifactsHttp.{port,bindAddress} on the provider vars"

- name: Create boot artifacts directory for provider
  ansible.builtin.file:
    path: "{{ gitups_host_state_dir }}/providers/{{ gitups_current_provider.name }}/boot-artifacts"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write boot artifacts HTTP server systemd unit
  ansible.builtin.copy:
    dest: "/etc/systemd/system/gitups-boot-artifacts-{{ gitups_current_provider.name }}.service"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Gitups boot artifacts HTTP server for provider {{ gitups_current_provider.name }}
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/python3 -m http.server {{ gitups_current_provider.bootArtifactsHttp.port | int }} --bind {{ gitups_current_provider.bootArtifactsHttp.bindAddress }} --directory {{ gitups_host_state_dir }}/providers/{{ gitups_current_provider.name }}/boot-artifacts
      Restart=on-failure
      RestartSec=5
      StandardOutput=append:{{ gitups_host_state_dir }}/providers/{{ gitups_current_provider.name }}/boot-artifacts-http.log
      StandardError=append:{{ gitups_host_state_dir }}/providers/{{ gitups_current_provider.name }}/boot-artifacts-http.log

      [Install]
      WantedBy=multi-user.target
  register: gitups_boot_artifacts_unit

- name: Restart boot artifacts HTTP server when unit changed
  ansible.builtin.systemd_service:
    name: "gitups-boot-artifacts-{{ gitups_current_provider.name }}.service"
    state: restarted
    enabled: true
    daemon_reload: true
  when: gitups_boot_artifacts_unit.changed

- name: Ensure boot artifacts HTTP server is running
  ansible.builtin.systemd_service:
    name: "gitups-boot-artifacts-{{ gitups_current_provider.name }}.service"
    state: started
    enabled: true

- name: Wait for boot artifacts HTTP endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitups_current_provider.bootArtifactsHttp.port | int }}/"
    method: GET
    status_code: 200
    return_content: false
  register: gitups_boot_artifacts_ready
  retries: 30
  delay: 1
  until: gitups_boot_artifacts_ready.status == 200
