---
- name: Slurp mirror registry credentials secret
  ansible.builtin.slurp:
    src: "{{ gitups_secrets_dir }}/{{ gitups_current_mirror_registry.credentialsSecretName }}"
  register: gitups_mirror_registry_credentials_raw
  no_log: true
  when: (gitups_current_mirror_registry.credentialsSecretName | default('')) | length > 0

- name: Parse mirror registry credentials
  ansible.builtin.set_fact:
    gitups_mirror_registry_credentials: "{{ gitups_mirror_registry_credentials_raw | gitups_parse_credential('mirror registry credentialsSecret ' ~ gitups_current_mirror_registry.credentialsSecretName) }}"
  no_log: true
  when: gitups_mirror_registry_credentials_raw is defined and gitups_mirror_registry_credentials_raw.content is defined

- name: Expose mirror registry username and password as facts
  ansible.builtin.set_fact:
    gitups_mirror_registry_username: "{{ gitups_mirror_registry_credentials.username }}"
    gitups_mirror_registry_password: "{{ gitups_mirror_registry_credentials.password }}"
  no_log: true
  when: gitups_mirror_registry_credentials is defined

- name: Render htpasswd file for mirror registry
  ansible.builtin.shell:
    cmd: >
      htpasswd -nbB
      {{ gitups_mirror_registry_username | quote }}
      {{ gitups_mirror_registry_password | quote }}
      > {{ gitups_mirror_registry_auth_dir }}/htpasswd
  args:
    creates: "{{ gitups_mirror_registry_auth_dir }}/htpasswd"
  register: gitups_mirror_registry_htpasswd_create
  no_log: true
  when: gitups_mirror_registry_credentials is defined

- name: Compute mirror registry htpasswd checksum
  ansible.builtin.stat:
    path: "{{ gitups_mirror_registry_auth_dir }}/htpasswd"
  register: gitups_mirror_registry_htpasswd_stat

- name: Slurp mirror registry TLS certificate
  ansible.builtin.slurp:
    src: "{{ gitups_secrets_dir }}/{{ gitups_current_mirror_registry.trustBundleCertSecretName }}"
  register: gitups_mirror_registry_cert_raw
  no_log: true
  when: (gitups_current_mirror_registry.trustBundleCertSecretName | default('')) | length > 0

- name: Slurp mirror registry TLS key
  ansible.builtin.slurp:
    src: "{{ gitups_secrets_dir }}/{{ gitups_current_mirror_registry.trustBundleKeySecretName }}"
  register: gitups_mirror_registry_key_raw
  no_log: true
  when: (gitups_current_mirror_registry.trustBundleKeySecretName | default('')) | length > 0

- name: Write mirror registry TLS certificate
  ansible.builtin.copy:
    dest: "{{ gitups_mirror_registry_certs_dir }}/registry.crt"
    owner: root
    group: root
    mode: "0644"
    content: "{{ gitups_mirror_registry_cert_raw.content | b64decode }}"
  when: gitups_mirror_registry_cert_raw is defined and gitups_mirror_registry_cert_raw.content is defined
  register: gitups_mirror_registry_cert_write

- name: Write mirror registry TLS key
  ansible.builtin.copy:
    dest: "{{ gitups_mirror_registry_certs_dir }}/registry.key"
    owner: root
    group: root
    mode: "0600"
    content: "{{ gitups_mirror_registry_key_raw.content | b64decode }}"
  no_log: true
  when: gitups_mirror_registry_key_raw is defined and gitups_mirror_registry_key_raw.content is defined

- name: Apply mirror registry trust to host CA store
  ansible.builtin.include_tasks: setup-trust.yml
  when: gitups_mirror_registry_cert_write is defined
