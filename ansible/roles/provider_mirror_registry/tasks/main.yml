---
# provider_mirror_registry brings up a docker/distribution registry on the
# provider host so disconnected installs can pull the OCP release payload
# from a local source. The flow is split into focused task files so each
# stage of the convergence is inspectable on its own.
- name: Install packages, create state dirs, persist requirements snapshots
  ansible.builtin.import_tasks: prepare-host.yml

- name: Materialise registry credentials, htpasswd, TLS material, host CA trust
  ansible.builtin.import_tasks: credentials.yml

- name: Resolve and pull the registry server image (local-first, public fallback)
  ansible.builtin.import_tasks: image.yml

- name: Run the registry container and assert it stays healthy
  ansible.builtin.import_tasks: container.yml

- name: Mirror upstream images into the local registry
  ansible.builtin.include_tasks: mirror-images.yml
  when:
    - not ansible_check_mode
    - (gitups_current_mirror_registry.mirrorSet | default([])) | length > 0
