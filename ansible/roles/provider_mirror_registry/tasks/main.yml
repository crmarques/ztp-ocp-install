---
- name: Install Podman, skopeo, httpd-tools for mirror registry
  ansible.builtin.package:
    name:
      - podman
      - skopeo
      - httpd-tools
      - ca-certificates
    state: present

- name: Create mirror registry state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ gitups_mirror_registry_root }}", mode: "0755" }
    - { path: "{{ gitups_mirror_registry_auth_dir }}", mode: "0700" }
    - { path: "{{ gitups_mirror_registry_certs_dir }}", mode: "0700" }
    - { path: "{{ gitups_mirror_registry_data_dir }}", mode: "0755" }
    - { path: "{{ gitups_mirror_registry_tools_dir }}", mode: "0755" }

- name: Persist mirror registry requirements snapshot
  ansible.builtin.copy:
    dest: "{{ gitups_mirror_registry_root }}/requirements.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      name: {{ gitups_current_mirror_registry.name }}
      providerRef: {{ gitups_current_mirror_registry.providerRef }}
      providerHostRef: {{ gitups_current_mirror_registry.providerHostRef }}
      url: {{ gitups_current_mirror_registry.url }}
      host: {{ gitups_current_mirror_registry.host }}
      port: {{ gitups_current_mirror_registry.port }}
      runtime: {{ gitups_current_mirror_registry.runtime }}
      image:
        local: {{ gitups_current_mirror_registry.image.local | default('') }}
        public: {{ gitups_current_mirror_registry.image.public | default('') }}
  register: gitups_mirror_registry_requirements

- name: Persist mirror set snapshot
  ansible.builtin.copy:
    dest: "{{ gitups_mirror_registry_root }}/mirror-set.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      mirrorSet:
      {% for entry in gitups_current_mirror_registry.mirrorSet %}
        - kind: {{ entry.kind }}
          public: {{ entry.public }}
          local: {{ entry.local }}
      {% endfor %}

- name: Slurp mirror registry credentials secret
  ansible.builtin.slurp:
    src: "{{ gitups_secrets_dir }}/{{ gitups_current_mirror_registry.credentialsSecretName }}"
  register: gitups_mirror_registry_credentials_raw
  no_log: true
  when: (gitups_current_mirror_registry.credentialsSecretName | default('')) | length > 0

- name: Decode mirror registry credentials
  ansible.builtin.set_fact:
    gitups_mirror_registry_credentials: "{{ (gitups_mirror_registry_credentials_raw.content | b64decode).strip() }}"
  no_log: true
  when: gitups_mirror_registry_credentials_raw is defined and gitups_mirror_registry_credentials_raw.content is defined

- name: Split mirror registry credentials into username and password
  ansible.builtin.set_fact:
    gitups_mirror_registry_username: "{{ gitups_mirror_registry_credentials.split(':', 1)[0] }}"
    gitups_mirror_registry_password: "{{ gitups_mirror_registry_credentials.split(':', 1)[1] }}"
  no_log: true
  when: gitups_mirror_registry_credentials is defined

- name: Render htpasswd file for mirror registry
  ansible.builtin.shell:
    cmd: >
      htpasswd -nbB
      {{ gitups_mirror_registry_username | quote }}
      {{ gitups_mirror_registry_password | quote }}
      > {{ gitups_mirror_registry_auth_dir }}/htpasswd
  args:
    creates: "{{ gitups_mirror_registry_auth_dir }}/htpasswd"
  register: gitups_mirror_registry_htpasswd_create
  no_log: true
  when: gitups_mirror_registry_credentials is defined

- name: Compute mirror registry htpasswd checksum
  ansible.builtin.stat:
    path: "{{ gitups_mirror_registry_auth_dir }}/htpasswd"
  register: gitups_mirror_registry_htpasswd_stat

- name: Slurp mirror registry TLS certificate
  ansible.builtin.slurp:
    src: "{{ gitups_secrets_dir }}/{{ gitups_current_mirror_registry.trustBundleCertSecretName }}"
  register: gitups_mirror_registry_cert_raw
  no_log: true
  when: (gitups_current_mirror_registry.trustBundleCertSecretName | default('')) | length > 0

- name: Slurp mirror registry TLS key
  ansible.builtin.slurp:
    src: "{{ gitups_secrets_dir }}/{{ gitups_current_mirror_registry.trustBundleKeySecretName }}"
  register: gitups_mirror_registry_key_raw
  no_log: true
  when: (gitups_current_mirror_registry.trustBundleKeySecretName | default('')) | length > 0

- name: Write mirror registry TLS certificate
  ansible.builtin.copy:
    dest: "{{ gitups_mirror_registry_certs_dir }}/registry.crt"
    owner: root
    group: root
    mode: "0644"
    content: "{{ gitups_mirror_registry_cert_raw.content | b64decode }}"
  when: gitups_mirror_registry_cert_raw is defined and gitups_mirror_registry_cert_raw.content is defined
  register: gitups_mirror_registry_cert_write

- name: Write mirror registry TLS key
  ansible.builtin.copy:
    dest: "{{ gitups_mirror_registry_certs_dir }}/registry.key"
    owner: root
    group: root
    mode: "0600"
    content: "{{ gitups_mirror_registry_key_raw.content | b64decode }}"
  no_log: true
  when: gitups_mirror_registry_key_raw is defined and gitups_mirror_registry_key_raw.content is defined

- name: Apply mirror registry trust to host CA store
  ansible.builtin.include_tasks: setup-trust.yml
  when: gitups_mirror_registry_cert_write is defined

# Pull strategy: try `local` first when the user declared one; fall back to
# `public` only when local is unset or its pull fails. On bootstrap the
# local registry does not exist yet, so the fallback to `public` is the
# expected first-apply path. After mirror-images.yml runs once the registry
# server image has been mirrored locally and subsequent applies stay
# air-gapped from the cluster network.
- name: Pull mirror registry server image from local registry
  containers.podman.podman_image:
    name: "{{ gitups_current_mirror_registry.image.local }}"
    state: present
    pull: true
  register: gitups_mirror_registry_pull_local
  failed_when: false
  when: (gitups_current_mirror_registry.image.local | default('')) | length > 0

- name: Check whether mirror registry local image is in podman storage
  ansible.builtin.command:
    argv:
      - podman
      - image
      - exists
      - "{{ gitups_current_mirror_registry.image.local }}"
  register: gitups_mirror_registry_local_present
  changed_when: false
  failed_when: false
  when: (gitups_current_mirror_registry.image.local | default('')) | length > 0

- name: Pull mirror registry server image from public registry
  containers.podman.podman_image:
    name: "{{ gitups_current_mirror_registry.image.public }}"
    state: present
    pull: true
  register: gitups_mirror_registry_pull_public
  failed_when: false
  when:
    - (gitups_current_mirror_registry.image.public | default('')) | length > 0
    - >-
      (gitups_current_mirror_registry.image.local | default('')) | length == 0
      or (gitups_mirror_registry_local_present.rc | default(1) != 0)

- name: Check whether mirror registry public image is in podman storage
  ansible.builtin.command:
    argv:
      - podman
      - image
      - exists
      - "{{ gitups_current_mirror_registry.image.public }}"
  register: gitups_mirror_registry_public_present
  changed_when: false
  failed_when: false
  when: (gitups_current_mirror_registry.image.public | default('')) | length > 0

- name: Resolve mirror registry server image ref for run
  ansible.builtin.set_fact:
    gitups_mirror_registry_run_image: >-
      {{ gitups_current_mirror_registry.image.local
         if (gitups_mirror_registry_local_present.rc | default(1) == 0)
         else gitups_current_mirror_registry.image.public }}

- name: Fail when mirror registry server image cannot be pulled
  ansible.builtin.fail:
    msg: >-
      Mirror registry server image pull failed.
      local={{ gitups_current_mirror_registry.image.local | default('<unset>') }},
      public={{ gitups_current_mirror_registry.image.public | default('<unset>') }}.
      First apply requires outbound reachability to the public ref;
      subsequent applies pull from the local mirror.
  when:
    - (gitups_mirror_registry_local_present.rc | default(1) != 0)
    - (gitups_mirror_registry_public_present.rc | default(1) != 0)

- name: Compute mirror registry spec fingerprint
  ansible.builtin.set_fact:
    gitups_mirror_registry_spec_hash: >-
      {{ (gitups_mirror_registry_requirements.checksum
          ~ '|htpasswd=' ~ (gitups_mirror_registry_htpasswd_stat.stat.checksum | default(''))
          ~ '|cert=' ~ (gitups_mirror_registry_cert_write.checksum | default(''))
          ~ '|run-image=' ~ gitups_mirror_registry_run_image
          ~ '|port=' ~ gitups_current_mirror_registry.port | string
          ~ '|run-args=v1:user=0:0,net=host,restart=unless-stopped'
         ) | hash('sha1') }}
  changed_when: false

- name: Inspect existing mirror registry container
  containers.podman.podman_container_info:
    name: "{{ gitups_mirror_registry_container_name }}"
  register: gitups_mirror_registry_existing
  failed_when: false

- name: Resolve mirror registry recreate decision
  ansible.builtin.set_fact:
    gitups_mirror_registry_recreate: >-
      {{
        (gitups_mirror_registry_existing.containers | default([]) | length) == 0
        or (((gitups_mirror_registry_existing.containers | first).Config.Labels | default({}))['gitups.spec-hash'] | default('')) != gitups_mirror_registry_spec_hash
        or not ((gitups_mirror_registry_existing.containers | first).State.Running | default(false))
      }}
  changed_when: false

- name: Run mirror registry container
  containers.podman.podman_container:
    name: "{{ gitups_mirror_registry_container_name }}"
    image: "{{ gitups_mirror_registry_run_image }}"
    state: started
    recreate: "{{ gitups_mirror_registry_recreate | bool }}"
    network: host
    user: "0:0"
    restart_policy: unless-stopped
    pull: never
    labels:
      gitups.spec-hash: "{{ gitups_mirror_registry_spec_hash }}"
      gitups.mirror-registry: "{{ gitups_current_mirror_registry.name }}"
    env:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/registry.crt
      REGISTRY_HTTP_TLS_KEY: /certs/registry.key
      REGISTRY_HTTP_ADDR: "0.0.0.0:{{ gitups_current_mirror_registry.port }}"
    volumes:
      - "{{ gitups_mirror_registry_auth_dir }}:/auth:ro,Z"
      - "{{ gitups_mirror_registry_certs_dir }}:/certs:ro,Z"
      - "{{ gitups_mirror_registry_data_dir }}:/var/lib/registry:Z"
  when: gitups_mirror_registry_recreate | bool

- name: Probe mirror registry container stability
  ansible.builtin.command:
    argv:
      - timeout
      - "3"
      - podman
      - wait
      - --condition=stopped
      - "{{ gitups_mirror_registry_container_name }}"
  register: gitups_mirror_registry_wait
  failed_when: false
  changed_when: false

- name: Capture mirror registry container inspect for diagnostics
  containers.podman.podman_container_info:
    name: "{{ gitups_mirror_registry_container_name }}"
  register: gitups_mirror_registry_post_inspect
  failed_when: false

- name: Capture mirror registry container logs for diagnostics
  ansible.builtin.command:
    argv:
      - podman
      - logs
      - --tail=500
      - --timestamps
      - "{{ gitups_mirror_registry_container_name }}"
  register: gitups_mirror_registry_logs
  failed_when: false
  changed_when: false

- name: Persist mirror registry container inspect snapshot
  ansible.builtin.copy:
    dest: "{{ gitups_mirror_registry_root }}/last-inspect.json"
    owner: root
    group: root
    mode: "0644"
    content: "{{ (gitups_mirror_registry_post_inspect.containers | default([])) | to_nice_json }}"

- name: Persist mirror registry container log snapshot
  ansible.builtin.copy:
    dest: "{{ gitups_mirror_registry_root }}/last-run.log"
    owner: root
    group: root
    mode: "0644"
    content: "{{ gitups_mirror_registry_logs.stdout | default('') }}\n===== stderr =====\n{{ gitups_mirror_registry_logs.stderr | default('') }}\n"

- name: Resolve final mirror registry container state
  ansible.builtin.set_fact:
    gitups_mirror_registry_final_state: "{{ ((gitups_mirror_registry_post_inspect.containers | first).State | default({})) if (gitups_mirror_registry_post_inspect.containers | default([]) | length) > 0 else {} }}"
  changed_when: false

# timeout(1) returns 124 when the wait kept blocking; that means no stop
# event occurred during the probe window, so the container is stably
# running. Any other rc means the registry hit a stop state at least once.
- name: Fail when mirror registry container is not healthy
  ansible.builtin.fail:
    msg: |
      Mirror registry container {{ gitups_mirror_registry_container_name }} is not running cleanly.
      Status:        {{ gitups_mirror_registry_final_state.Status | default('unknown') }}
      Running:       {{ gitups_mirror_registry_final_state.Running | default(false) }}
      ExitCode:      {{ gitups_mirror_registry_final_state.ExitCode | default('n/a') }}
      Probe rc:      {{ gitups_mirror_registry_wait.rc }}
      Logs:    {{ gitups_mirror_registry_root }}/last-run.log
      Inspect: {{ gitups_mirror_registry_root }}/last-inspect.json
  when: gitups_mirror_registry_wait.rc != 124

- name: Mirror upstream images into the local registry
  ansible.builtin.include_tasks: mirror-images.yml
  when:
    - not ansible_check_mode
    - (gitups_current_mirror_registry.mirrorSet | default([])) | length > 0
