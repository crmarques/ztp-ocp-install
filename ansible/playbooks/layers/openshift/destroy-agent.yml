---
- name: Destroy OpenShift agent install state
  hosts: bootwright_ocp_hosts
  gather_facts: false
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve cluster context
      ansible.builtin.import_role:
        name: context_cluster

  tasks:
    - name: Resolve proxy settings
      ansible.builtin.import_role:
        name: host_proxy
        tasks_from: facts

    - name: Destroy agent install state
      ansible.builtin.import_role:
        name: destroy_agent
      when: bootwright_current_cluster.ocp.install.method == 'agent'

    - name: Strip host-level proxy configuration
      ansible.builtin.import_role:
        name: host_proxy
        tasks_from: cleanup
