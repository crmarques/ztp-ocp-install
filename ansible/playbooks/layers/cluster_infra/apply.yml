---
- name: Prepare Gitups per-cluster infrastructure
  hosts: gitups_infra_hosts
  gather_subset:
    - "!all"
    - min
  become: true
  environment: "{{ gitups_proxy_env | default({}) }}"

  pre_tasks:
    - name: Build cluster context
      ansible.builtin.import_role:
        name: context_cluster

  tasks:
    - name: Apply host proxy role
      ansible.builtin.import_role:
        name: host_proxy

    - name: Apply host base role
      ansible.builtin.import_role:
        name: host_base

    - name: Apply substrate role for current provider kind
      ansible.builtin.include_role:
        name: "substrate_{{ gitups_current_cluster.provider.substrateRole }}"

    - name: Plumb managed load balancer VIPs onto the cluster bridge
      ansible.builtin.import_role:
        name: network_vips

    - name: Apply managed name resolution
      ansible.builtin.import_role:
        name: name_resolution_hosts_file
      when: gitups_current_cluster.network.nameResolution.mode == 'managed'

    - name: Validate external network reachability
      ansible.builtin.import_role:
        name: external_network_validate
      when: gitups_current_cluster.network.nameResolution.mode == 'external' or gitups_current_cluster.network.loadBalancer.external | default(false) | bool
