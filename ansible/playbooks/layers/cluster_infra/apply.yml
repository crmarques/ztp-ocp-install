---
- name: Apply cluster infrastructure
  hosts: bootwright_infra_hosts
  gather_subset:
    - "!all"
    - min
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve cluster context
      ansible.builtin.import_role:
        name: context_cluster

  tasks:
    - name: Persist host proxy settings
      ansible.builtin.import_role:
        name: host_proxy

    - name: Apply base host packages
      ansible.builtin.import_role:
        name: host_base

    - name: Apply substrate provider
      ansible.builtin.include_role:
        name: "substrate_{{ bootwright_current_cluster.provider.substrateRole }}"

    - name: Attach managed load balancer VIPs
      ansible.builtin.import_role:
        name: network_vips

    - name: Apply managed hosts-file records
      ansible.builtin.import_role:
        name: name_resolution_hosts_file
      when: bootwright_current_cluster.network.nameResolution.mode == 'managed'

    - name: Validate external DNS and load balancer
      ansible.builtin.import_role:
        name: external_network_validate
      when: bootwright_current_cluster.network.nameResolution.mode == 'external' or bootwright_current_cluster.network.loadBalancer.external | default(false) | bool
