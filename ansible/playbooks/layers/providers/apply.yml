---
- name: Apply provider services
  hosts: bootwright_provider_hosts
  gather_subset:
    - "!all"
    - min
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve provider context
      ansible.builtin.import_role:
        name: context_provider

  tasks:
    - name: Apply managed proxy
      ansible.builtin.import_role:
        name: proxy_squid
      when: bootwright_current_forward_proxy is not none

    - name: Persist host proxy settings
      ansible.builtin.import_role:
        name: host_proxy

    - name: Apply provider BMC service
      ansible.builtin.include_role:
        name: "bmc_{{ bootwright_current_provider.bmcRole }}"

    - name: Apply boot artifacts HTTP service
      ansible.builtin.import_role:
        name: boot_artifacts_http
      when: bootwright_current_provider.bootArtifactsHttp.enabled | default(false) | bool

    - name: Apply mirror registry
      ansible.builtin.import_role:
        name: mirror_registry
      when: bootwright_current_mirror_registry is not none

    - name: Apply managed load balancers
      ansible.builtin.import_role:
        name: load_balancer_haproxy
      when: bootwright_current_load_balancers | length > 0
