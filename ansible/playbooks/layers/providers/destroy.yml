---
- name: Destroy provider services
  hosts: gitups_provider_hosts
  gather_facts: false
  become: true
  environment: "{{ gitups_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve provider context
      ansible.builtin.import_role:
        name: context_provider

  tasks:
    - name: Resolve proxy settings
      ansible.builtin.import_role:
        name: host_proxy
        tasks_from: facts

    - name: Destroy mirror registry
      ansible.builtin.import_role:
        name: mirror_registry
        tasks_from: destroy.yml

    - name: Destroy boot artifacts HTTP service
      ansible.builtin.import_role:
        name: boot_artifacts_http
        tasks_from: destroy.yml

    - name: Destroy provider BMC service
      ansible.builtin.include_role:
        name: "bmc_{{ gitups_current_provider.bmcRole }}"
        tasks_from: destroy.yml

    - name: Destroy managed load balancers
      ansible.builtin.import_role:
        name: load_balancer_haproxy
        tasks_from: destroy.yml

    - name: Destroy managed proxy
      ansible.builtin.import_role:
        name: proxy_squid
        tasks_from: destroy.yml

    # Strip host-level proxy artifacts (/etc/environment block, systemd
    # drop-in, dnf/yum/pip proxy lines, etc.) AFTER proxy_squid destroy,
    # so the host stops routing through a Squid that no longer exists.
    # Must run last among proxy steps — earlier role destroys may still
    # need outbound HTTP via gitups_proxy_env on the task environment.
    - name: Strip host-level proxy configuration
      ansible.builtin.import_role:
        name: host_proxy
        tasks_from: cleanup

    - name: Remove empty host state root
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ gitups_host_state_dir }}"
      register: gitups_root_rm
      failed_when: false
      changed_when: gitups_root_rm.rc == 0
