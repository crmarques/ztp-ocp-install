---
- name: Destroy provider services
  hosts: bootwright_provider_hosts
  gather_facts: false
  become: true
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    - name: Resolve provider context
      ansible.builtin.import_role:
        name: context_provider

  tasks:
    - name: Resolve proxy settings
      ansible.builtin.import_role:
        name: host_proxy
        tasks_from: facts

    - name: Destroy mirror registry
      ansible.builtin.import_role:
        name: mirror_registry
        tasks_from: destroy.yml

    - name: Destroy boot artifacts HTTP service
      ansible.builtin.import_role:
        name: boot_artifacts_http
        tasks_from: destroy.yml

    - name: Destroy provider BMC service
      ansible.builtin.include_role:
        name: "bmc_{{ bootwright_current_provider.bmcRole }}"
        tasks_from: destroy.yml

    - name: Destroy managed load balancers
      ansible.builtin.import_role:
        name: load_balancer_haproxy
        tasks_from: destroy.yml

    - name: Destroy managed proxy
      ansible.builtin.import_role:
        name: proxy_squid
        tasks_from: destroy.yml

    # Must run AFTER proxy_squid destroy and last among proxy steps —
    # earlier role destroys still need outbound HTTP via bootwright_proxy_env.
    - name: Strip host-level proxy configuration
      ansible.builtin.import_role:
        name: host_proxy
        tasks_from: cleanup

    - name: Remove empty host state root
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ bootwright_host_state_dir }}"
      register: bootwright_root_rm
      failed_when: false
      changed_when: bootwright_root_rm.rc == 0
