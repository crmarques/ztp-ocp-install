---
- name: Tear down Gitups provider-scoped infrastructure
  hosts: gitups_provider_hosts
  gather_facts: false
  become: true
  environment: "{{ gitups_proxy_env | default({}) }}"

  pre_tasks:
    - name: Build provider context
      ansible.builtin.import_role:
        name: context_provider

  tasks:
    - name: Build proxy facts for downstream tasks
      ansible.builtin.import_role:
        name: host_proxy
        tasks_from: facts

    - name: Destroy mirror registry role
      ansible.builtin.import_role:
        name: mirror_registry
        tasks_from: destroy.yml

    - name: Destroy boot-artifacts HTTP role
      ansible.builtin.import_role:
        name: boot_artifacts_http
        tasks_from: destroy.yml

    - name: Destroy BMC role for current provider kind
      ansible.builtin.include_role:
        name: "bmc_{{ gitups_current_provider.bmcRole }}"
        tasks_from: destroy.yml

    - name: Destroy managed load balancer role
      ansible.builtin.import_role:
        name: load_balancer_haproxy
        tasks_from: destroy.yml

    - name: Destroy managed forward proxy role
      ansible.builtin.import_role:
        name: proxy_squid
        tasks_from: destroy.yml

    - name: Remove Gitups host state root if empty
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ gitups_host_state_dir }}"
      register: gitups_root_rm
      failed_when: false
      changed_when: gitups_root_rm.rc == 0
