---
# Installs `oc`, `kubectl`, and `openshift-install` on the controller from
# the public OpenShift mirror. Only CLIs that the mirror serves without an
# entitlement token are handled here; a `cluster_admin_creds`-bearing source
# would belong to a separate playbook by design.
- name: Install OpenShift CLIs on the controller host
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Install OCP CLIs at requested release
      ansible.builtin.import_role:
        name: controller_clis
