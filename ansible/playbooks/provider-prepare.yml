---
- name: Prepare Gitups provider-scoped infrastructure components
  hosts: gitups_provider_hosts
  # `min` is enough for everything this play does: ansible.builtin.package
  # dispatch needs ansible_distribution / ansible_os_family (both in min),
  # and no role on this host group reads ansible_facts.env, mounts, or
  # interfaces. Stripping the rest avoids the multi-second hardware probe.
  gather_subset:
    - "!all"
    - min
  # Escalation comes from `ansible_become: true` rendered onto every provider
  # host in the inventory. The controller is never a target of this play, so
  # there is no user/root distinction to draw at the play level.
  environment: "{{ gitups_proxy_env | default({}) }}"

  pre_tasks:
    - name: Select provider for current host
      ansible.builtin.set_fact:
        gitups_current_provider: "{{ gitups_providers | selectattr('name', 'equalto', gitups_provider_name) | first }}"
      changed_when: false

    - name: Select managed load balancers for current host
      ansible.builtin.set_fact:
        gitups_current_load_balancers: "{{ gitups_load_balancers | selectattr('providerRef', 'equalto', gitups_provider_name) | selectattr('placement.providerHostRef', 'equalto', gitups_host_name) | list }}"
      changed_when: false

    - name: Select mirror registry for current host
      ansible.builtin.set_fact:
        gitups_current_mirror_registry: "{{ (gitups_mirror_registries | default([]) | selectattr('providerRef', 'equalto', gitups_provider_name) | selectattr('providerHostRef', 'equalto', gitups_host_name) | list | first) | default(None) }}"
      changed_when: false

  tasks:
    - name: Apply host proxy role
      ansible.builtin.import_role:
        name: host_proxy

    # BMC dispatch by structural discriminator. provider_bmc_none is the
    # explicit empty case (vSphere, KubeVirt) so the dynamic role-name
    # always resolves.
    - name: Apply BMC role for current provider kind
      ansible.builtin.include_role:
        name: "provider_bmc_{{ gitups_current_provider.bmcRole }}"

    - name: Apply boot-artifacts HTTP role
      ansible.builtin.import_role:
        name: provider_boot_artifacts_http
      when: gitups_current_provider.bootArtifactsHttp.enabled | default(false) | bool

    # Mirror registry must run before the load balancer role: HAProxy is
    # pulled from the local mirror on subsequent applies, so the registry
    # has to be reachable first.
    - name: Apply mirror registry role
      ansible.builtin.import_role:
        name: provider_mirror_registry
      when: gitups_current_mirror_registry is not none

    - name: Apply managed load balancer role
      ansible.builtin.import_role:
        name: network_lb_managed
      when: gitups_current_load_balancers | length > 0
