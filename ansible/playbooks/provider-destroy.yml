---
- name: Tear down Gitups provider-scoped infrastructure
  hosts: gitups_provider_hosts
  gather_facts: false
  become: true

  pre_tasks:
    - name: Select provider for current host
      ansible.builtin.set_fact:
        gitups_current_provider: "{{ gitups_providers | selectattr('name', 'equalto', gitups_provider_name) | first }}"
      become: false
      changed_when: false

    - name: Select managed load balancers for current host
      ansible.builtin.set_fact:
        gitups_current_load_balancers: "{{ gitups_load_balancers | selectattr('providerRef', 'equalto', gitups_provider_name) | selectattr('placement.providerHostRef', 'equalto', gitups_host_name) | list }}"
      become: false
      changed_when: false

    - name: Select mirror registry for current host
      ansible.builtin.set_fact:
        gitups_current_mirror_registry: "{{ (gitups_mirror_registries | default([]) | selectattr('providerRef', 'equalto', gitups_provider_name) | selectattr('providerHostRef', 'equalto', gitups_host_name) | list | first) | default(None) }}"
      become: false
      changed_when: false

  tasks:
    - name: Stop and remove mirror registry container
      containers.podman.podman_container:
        name: "gitups-mirror-registry-{{ gitups_current_mirror_registry.name }}"
        state: absent
      when: gitups_current_mirror_registry is not none
      failed_when: false

    - name: Remove mirror registry trust anchor
      ansible.builtin.file:
        path: "/etc/pki/ca-trust/source/anchors/gitups-mirror-{{ gitups_current_mirror_registry.host }}.crt"
        state: absent
      register: gitups_mirror_registry_trust_remove
      when: gitups_current_mirror_registry is not none

    - name: Refresh host CA trust store after mirror registry removal
      ansible.builtin.command:
        argv:
          - update-ca-trust
      when:
        - gitups_current_mirror_registry is not none
        - gitups_mirror_registry_trust_remove.changed
      changed_when: gitups_mirror_registry_trust_remove.changed

    # When `gitups destroy --keep-mirrored-images` is set we skip removal of
    # the registry data volume so the next apply does not have to re-pull
    # the release payload + componentImages from public registries. The
    # trust anchor, htpasswd, certs, and metadata are still wiped — they
    # are cheap to re-render from secrets on the next apply.
    - name: Remove mirror registry state directory (full destroy)
      ansible.builtin.file:
        path: "{{ gitups_host_state_dir }}/mirror-registry/{{ gitups_current_mirror_registry.name }}"
        state: absent
      when:
        - gitups_current_mirror_registry is not none
        - not (gitups_keep_mirrored_images | default(false) | bool)

    - name: Remove mirror registry transient state (preserve data volume)
      ansible.builtin.file:
        path: "{{ gitups_host_state_dir }}/mirror-registry/{{ gitups_current_mirror_registry.name }}/{{ item }}"
        state: absent
      loop:
        - auth
        - certs
        - tools
        - requirements.yml
        - mirror-set.yml
        - last-inspect.json
        - last-run.log
        - mirror-results.json
      when:
        - gitups_current_mirror_registry is not none
        - gitups_keep_mirrored_images | default(false) | bool

    - name: Report retained mirror registry data volume
      ansible.builtin.debug:
        msg: "Retained mirror registry data volume at {{ gitups_host_state_dir }}/mirror-registry/{{ gitups_current_mirror_registry.name }}/data (gitups destroy --keep-mirrored-images)"
      when:
        - gitups_current_mirror_registry is not none
        - gitups_keep_mirrored_images | default(false) | bool

    - name: Remove mirror-registry parent directory if empty
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ gitups_host_state_dir }}/mirror-registry"
      register: gitups_mirror_registry_parent_rm
      failed_when: false
      changed_when: gitups_mirror_registry_parent_rm.rc == 0

    - name: Stop sushy-emulator service for current provider
      ansible.builtin.systemd_service:
        name: "gitups-sushy-{{ gitups_current_provider.name }}.service"
        state: stopped
        enabled: false
      register: gitups_sushy_stop
      failed_when: false
      changed_when: gitups_sushy_stop.changed | default(false)
      when: gitups_current_provider.bmcRole == 'emulated'

    - name: Stop vmedia HTTP server for current provider
      ansible.builtin.systemd_service:
        name: "gitups-vmedia-{{ gitups_current_provider.name }}.service"
        state: stopped
        enabled: false
      register: gitups_vmedia_stop
      failed_when: false
      changed_when: gitups_vmedia_stop.changed | default(false)
      when: gitups_current_provider.bmcRole == 'emulated'

    - name: Stop boot artifacts HTTP server for current provider
      ansible.builtin.systemd_service:
        name: "gitups-boot-artifacts-{{ gitups_current_provider.name }}.service"
        state: stopped
        enabled: false
      register: gitups_boot_artifacts_stop
      failed_when: false
      changed_when: gitups_boot_artifacts_stop.changed | default(false)
      when: gitups_current_provider.bootArtifactsHttp.enabled | default(false) | bool

    - name: Remove sushy-emulator systemd unit
      ansible.builtin.file:
        path: "/etc/systemd/system/gitups-sushy-{{ gitups_current_provider.name }}.service"
        state: absent
      register: gitups_sushy_unit_remove

    - name: Remove vmedia HTTP systemd unit
      ansible.builtin.file:
        path: "/etc/systemd/system/gitups-vmedia-{{ gitups_current_provider.name }}.service"
        state: absent
      register: gitups_vmedia_unit_remove

    - name: Remove boot artifacts HTTP systemd unit
      ansible.builtin.file:
        path: "/etc/systemd/system/gitups-boot-artifacts-{{ gitups_current_provider.name }}.service"
        state: absent
      register: gitups_boot_artifacts_unit_remove

    - name: Reload systemd after removing provider units
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: gitups_sushy_unit_remove.changed or gitups_vmedia_unit_remove.changed or gitups_boot_artifacts_unit_remove.changed

    - name: Destroy libvirt vmedia pool for current provider
      community.libvirt.virt_pool:
        name: "gitups-{{ gitups_current_provider.name }}-vmedia"
        state: absent
      failed_when: false

    - name: Remove managed HAProxy containers
      containers.podman.podman_container:
        name: "gitups-haproxy-{{ item.name }}"
        state: absent
      loop: "{{ gitups_current_load_balancers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove managed load balancer state directories
      ansible.builtin.file:
        path: "{{ gitups_host_state_dir }}/load-balancers/{{ item.name }}"
        state: absent
      loop: "{{ gitups_current_load_balancers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Remove load-balancers parent directory if empty
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ gitups_host_state_dir }}/load-balancers"
      register: gitups_lb_parent_rm
      failed_when: false
      changed_when: gitups_lb_parent_rm.rc == 0

    - name: Remove BMC emulator state for current provider
      ansible.builtin.file:
        path: "{{ gitups_host_state_dir }}/providers/{{ gitups_current_provider.name }}"
        state: absent

    - name: Remove providers parent directory if empty
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ gitups_host_state_dir }}/providers"
      register: gitups_providers_parent_rm
      failed_when: false
      changed_when: gitups_providers_parent_rm.rc == 0

    - name: Remove Gitups sysctl drop-in for HAProxy
      ansible.builtin.file:
        path: /etc/sysctl.d/99-gitups-haproxy.conf
        state: absent

    # Owns the host-state-root rmdir because provider phase is the last to
    # run during destroy (reverse of apply order). Cluster phase has already
    # cleared its per-cluster directories; everything else under the root
    # belongs to provider-scoped resources cleared above.
    - name: Remove Gitups host state root if empty
      ansible.builtin.command:
        argv:
          - rmdir
          - "{{ gitups_host_state_dir }}"
      register: gitups_root_rm
      failed_when: false
      changed_when: gitups_root_rm.rc == 0
