---
- name: Check provider host prerequisites
  hosts: bootwright_provider_hosts:bootwright_infra_hosts:bootwright_ocp_hosts
  gather_subset:
    - "!all"
    - min
    - env
  become: false
  environment: "{{ bootwright_proxy_env | default({}) }}"

  pre_tasks:
    # Schema-validate the rendered vars.yaml contract: the seven top-level
    # keys bootwright_render emits must all be defined. Catches render/Ansible
    # drift early — see ansible/VARS_CONTRACT.md.
    - name: Assert rendered vars contract
      ansible.builtin.assert:
        that:
          - bootwright_ocp_install is defined
          - bootwright_providers is iterable
          - bootwright_load_balancers is iterable
          - bootwright_mirror_registries is iterable
          - bootwright_clusters is iterable
          - bootwright_component_pins is iterable
        fail_msg: >-
          Rendered vars.yaml is missing required top-level facts. The render
          contract in ansible/VARS_CONTRACT.md was changed without an Ansible
          update, or vars.yaml was hand-edited. Re-run `bootwright apply` (or
          `bootwright check`) from the Go binary to refresh.

    - name: Select provider for this host
      ansible.builtin.set_fact:
        bootwright_current_provider: "{{ bootwright_providers | selectattr('name', 'equalto', bootwright_provider_name) | first }}"
      changed_when: false
      when: bootwright_provider_name is defined

  tasks:
    - name: Resolve proxy settings
      ansible.builtin.import_role:
        name: host_proxy
        tasks_from: facts

    - name: Verify Ansible transport
      ansible.builtin.ping:
      changed_when: false

    - name: Check passwordless sudo
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - "true"
      register: bootwright_preflight_sudo
      changed_when: false
      failed_when: false

    - name: Report sudo status
      ansible.builtin.debug:
        msg: >-
          sudo={{ 'passwordless' if bootwright_preflight_sudo.rc == 0 else 'password-required-or-unavailable' }}

    - name: Detect package manager
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - "command -v dnf || command -v yum || command -v apt-get"
      register: bootwright_preflight_package_manager
      changed_when: false
      failed_when: false

    - name: Report package manager
      ansible.builtin.debug:
        msg: "packageManager={{ bootwright_preflight_package_manager.stdout | default('missing') }}"

    - name: Check KVM device for libvirt providers
      ansible.builtin.stat:
        path: /dev/kvm
      register: bootwright_preflight_kvm
      when: bootwright_current_provider is defined and bootwright_current_provider.kind == 'libvirt'

    - name: Report KVM status
      ansible.builtin.debug:
        msg: "/dev/kvm={{ bootwright_preflight_kvm.stat.exists | default(false) }}"
      when: bootwright_current_provider is defined and bootwright_current_provider.kind == 'libvirt'
