---
- name: Remove published managed-cluster intent from GitOps repo
  hosts: localhost
  gather_facts: false
  become: false
  # gitops-publish does not yet stage managed-cluster intent into the hub-watched Git
  # repo, so there is nothing to revoke. When gitops-publish.yml gains real
  # tasks, this playbook gains the matching cleanup so destroy stays symmetric
  # with apply and leaves no host- or repo-side artifacts behind.
  tasks:
    - name: Confirm no managed-cluster intent to revoke
      ansible.builtin.debug:
        msg: >-
          gitops-unpublish: no published managed-cluster intent to remove
          (gitops-publish has not staged any artifacts).
