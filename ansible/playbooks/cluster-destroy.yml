---
- name: Tear down Gitups per-cluster infrastructure
  hosts: gitups_infra_hosts
  gather_facts: false
  become: true

  pre_tasks:
    - name: Select cluster infrastructure for current host
      ansible.builtin.set_fact:
        gitups_current_cluster: "{{ gitups_clusters | selectattr('name', 'equalto', gitups_cluster_name) | first }}"
      changed_when: false

  tasks:
    - name: Unplumb managed load balancer VIPs from the cluster bridge
      ansible.builtin.include_role:
        name: cluster_network_vips
        tasks_from: destroy.yml

    - name: Force-stop libvirt domains for current cluster
      community.libvirt.virt:
        name: "{{ gitups_current_cluster.name }}-{{ item.name }}"
        state: destroyed
      failed_when: false
      loop: "{{ gitups_current_cluster.provider.nodes | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: gitups_current_cluster.provider.kind == 'libvirt'

    - name: Undefine libvirt domains for current cluster
      community.libvirt.virt:
        command: undefine
        name: "{{ gitups_current_cluster.name }}-{{ item.name }}"
        flags:
          - remove_all_storage
          - keep_nvram
      failed_when: false
      loop: "{{ gitups_current_cluster.provider.nodes | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: gitups_current_cluster.provider.kind == 'libvirt'

    # Close the firewalld port opened by the substrate role before tearing
    # the libvirt bridge down: net-destroy removes the bridge, and the
    # firewalld zone binding goes with it.
    - name: Check firewalld state
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --state
      register: gitups_firewalld_state
      changed_when: false
      failed_when: false
      when: gitups_current_cluster.provider.kind == 'libvirt'

    - name: Close boot artifacts HTTP firewall port in the libvirt zone
      ansible.posix.firewalld:
        zone: libvirt
        port: "{{ gitups_current_cluster.provider.bootArtifactsHttp.port | int }}/tcp"
        state: disabled
        permanent: true
        immediate: true
      failed_when: false
      when:
        - gitups_current_cluster.provider.kind == 'libvirt'
        - gitups_firewalld_state.rc | default(1) == 0
        - gitups_current_cluster.provider.bootArtifactsHttp.enabled | default(false) | bool

    - name: Tear down libvirt network for current cluster
      community.libvirt.virt_net:
        name: "{{ gitups_current_cluster.provider.virtualization.libvirt.network }}"
        state: absent
      failed_when: false
      when:
        - gitups_current_cluster.provider.kind == 'libvirt'
        - (gitups_current_cluster.provider.virtualization.libvirt.network | default('')) | length > 0

    - name: Remove managed hosts-file block for current cluster
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} GITUPS {{ gitups_current_cluster.name }} hosts"
        state: absent
      when: gitups_current_cluster.network.nameResolution.mode == 'managed'

    - name: Remove cluster state directory
      ansible.builtin.file:
        path: "{{ gitups_host_state_dir }}/{{ gitups_current_cluster.name }}"
        state: absent
