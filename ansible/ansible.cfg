[defaults]
roles_path = ./roles
collections_path = ./collections
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False

[privilege_escalation]
# Preserve proxy env across become so dnf/apt/get_url running as root see the
# proxy values set by play-level `environment:` or inherited from the gitups
# CLI process. Without this, sudo strips HTTP_PROXY/HTTPS_PROXY/NO_PROXY and
# behind-proxy package installs fail.
become_flags = -H -S -n --preserve-env=HTTP_PROXY,HTTPS_PROXY,NO_PROXY,http_proxy,https_proxy,no_proxy

[ssh_connection]
pipelining = True
