apiVersion: gitups.io/v1alpha1
kind: ClusterInfrastructure
metadata:
  name: managed-01
spec:
  providerRefs:
    - name: qemu-redfish-provider
  networks:
    primary:
      cidr: 192.168.131.0/24
      gateway: 192.168.131.1
      dnsServers:
        - 192.168.131.1
      libvirt:
        bridge: vbr-managed
  machines:
    master-0:
      profileRef:
        name: compact
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.131.20
          macAddress: 52:54:00:21:12:10
      rootDeviceHints:
        deviceName: /dev/vda
      libvirt:
        hostRef:
          name: qemu-host
    master-1:
      profileRef:
        name: compact
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.131.21
          macAddress: 52:54:00:21:12:11
      rootDeviceHints:
        deviceName: /dev/vda
      libvirt:
        hostRef:
          name: qemu-host
    master-2:
      profileRef:
        name: compact
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.131.22
          macAddress: 52:54:00:21:12:12
      rootDeviceHints:
        deviceName: /dev/vda
      libvirt:
        hostRef:
          name: qemu-host
  endpoints:
    api:
      address: 192.168.131.10
    apiInt:
      address: 192.168.131.10
    ingress:
      address: 192.168.131.11
  loadBalancers:
    default:
      endpoints:
        - api
        - apiInt
        - ingress
