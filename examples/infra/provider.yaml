apiVersion: gitups.io/v1alpha1
kind: InfrastructureProvider
metadata:
  name: lab-provider
spec:
  hosts:
    hub-sno-host:
      ssh:
        address: 10.10.10.1
        keyRef:
          name: lab-provider-key
      capabilities:
        - libvirt
        - hosts-file
    spoke-01-host:
      ssh:
        address: 10.10.10.2
        keyRef:
          name: lab-provider-key
      capabilities:
        - libvirt
        - hosts-file
    spoke-02-host:
      ssh:
        address: 10.10.10.3
        keyRef:
          name: lab-provider-key
      capabilities:
        - libvirt
        - hosts-file
  machine:
    libvirt:
      hostRefs:
        - name: hub-sno-host
        - name: spoke-01-host
        - name: spoke-02-host
      bmcEmulation:
        enabled: true
        protocol: redfish
        port: 8000
        auth:
          credentialRef:
            name: lab-bmc-credentials
