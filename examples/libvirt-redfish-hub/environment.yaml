apiVersion: gitups.io/v1alpha1
kind: Environment
metadata:
  name: disconnected-hub
spec:
  baseDomain: disconnected.example.test
  ocpInstallType: disconnected
  proxy:
    http: http://proxy.disconnected.example.test:3128
    https: http://proxy.disconnected.example.test:3128
    noProxy:
      - 192.168.130.0/24
  registries:
    mirror:
      url: registry.disconnected.example.test:5000
      credentialsRef:
        name: disconnected-hub-registry
      trustBundleRef:
        name: disconnected-hub-registry-ca
    imageDigestSources:
      - source: quay.io/openshift-release-dev/ocp-release
        mirrors:
          - registry.disconnected.example.test:5000/openshift/release-images
      - source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
        mirrors:
          - registry.disconnected.example.test:5000/openshift/release-images
  secrets:
    openshift-pull-secret:
      file: ~/.gitups/secrets/openshift-pull-secret
    cluster-admin-key:
      file: ~/.ssh/gitups-ssh-key.pub
    libvirt-host-ssh:
      file: ~/.ssh/gitups-ssh-key
    libvirt-redfish-bmc:
      generated:
        credentials:
          username: admin
    disconnected-hub-registry-ca:
      generated:
        selfSignedCertificate:
          commonName: registry.disconnected.example.test
    disconnected-hub-registry:
      generated:
        credentials:
          username: admin
  openshift:
    release:
      channel: stable-4.21
      version: 4.21.12
  componentImages:
    load-balancer:
      haproxy:
        local: registry.disconnected.example.test:5000/library/haproxy:3.3.8
        public: docker.io/library/haproxy:3.3.8@sha256:f14a1788b56894e7ec7b5cb0ca09dbb959b674cf3c980f92139ec008167d4a91
