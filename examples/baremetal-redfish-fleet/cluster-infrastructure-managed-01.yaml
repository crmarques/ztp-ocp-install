apiVersion: gitups.io/v1alpha1
kind: ClusterInfrastructure
metadata:
  name: managed-01
spec:
  providerRef:
    name: baremetal-redfish-provider
  networks:
    primary:
      cidr: 192.168.131.0/24
      gateway: 192.168.131.1
      dnsServers:
        - 192.168.131.1
  machines:
    master-0:
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.131.20
          macAddress: 52:54:00:21:12:10
      rootDeviceHints:
        deviceName: /dev/sda
      baremetal:
        bmc:
          address: redfish-virtualmedia+https://bmc-managed-01-0.example.test/redfish/v1/Systems/1
          credentialRef:
            name: baremetal-redfish-bmc
          disableCertificateVerification: true
    master-1:
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.131.21
          macAddress: 52:54:00:21:12:11
      rootDeviceHints:
        deviceName: /dev/sda
      baremetal:
        bmc:
          address: redfish-virtualmedia+https://bmc-managed-01-1.example.test/redfish/v1/Systems/1
          credentialRef:
            name: baremetal-redfish-bmc
          disableCertificateVerification: true
    master-2:
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.131.22
          macAddress: 52:54:00:21:12:12
      rootDeviceHints:
        deviceName: /dev/sda
      baremetal:
        bmc:
          address: redfish-virtualmedia+https://bmc-managed-01-2.example.test/redfish/v1/Systems/1
          credentialRef:
            name: baremetal-redfish-bmc
          disableCertificateVerification: true
  endpoints:
    api:
      address: 192.168.131.10
    apiInt:
      address: 192.168.131.10
    ingress:
      address: 192.168.131.11
