apiVersion: gitups.io/v1alpha1
kind: ClusterInfrastructure
metadata:
  name: qemu-1-host-hub
spec:
  providerRefs:
    - name: qemu-1-host-provider
  networks:
    primary:
      cidr: 192.168.130.0/24
      gateway: 192.168.130.1
      dnsServers:
        - 192.168.130.1
      libvirt:
        bridge: vbr-1-host-hub
  machines:
    master-0:
      resources:
        cpu: 9
        memoryMiB: 19456
        diskGiB: 120
      rootDeviceHints:
        deviceName: /dev/vda
      interfaces:
        enp1s0:
          networkRef:
            name: primary
          ipAddress: 192.168.130.20
          macAddress: 52:54:00:21:11:10
      libvirt:
        hostRef:
          name: local-qemu-host
  endpoints:
    api:
      address: 192.168.130.10
    apiInt:
      address: 192.168.130.10
    ingress:
      address: 192.168.130.11
  loadBalancers:
    lb-qemu-1-host-hub:
      endpoints:
        - api
        - apiInt
        - ingress
