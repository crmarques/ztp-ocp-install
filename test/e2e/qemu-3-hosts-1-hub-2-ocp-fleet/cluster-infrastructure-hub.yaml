apiVersion: gitups.io/v1alpha1
kind: ClusterInfrastructure
metadata:
  name: qemu-3-hosts-hub
spec:
  providerRef:
    name: qemu-3-hosts-hub-provider
  networks:
    primary:
      cidr: 192.168.150.0/24
      gateway: 192.168.150.1
      dnsServers:
        - 192.168.150.1
      qemuKVM:
        bridge: vbr-hub
  machines:
    master-0:
      profileRef:
        name: compact-control-plane
      rootDeviceHints:
        deviceName: /dev/vda
      interfaces:
        enp1s0:
          networkRef:
            name: primary
          ipAddress: 192.168.150.20
          macAddress: 52:54:00:30:10:00
      qemuKVM:
        hostRef:
          name: hub-host
    master-1:
      profileRef:
        name: compact-control-plane
      rootDeviceHints:
        deviceName: /dev/vda
      interfaces:
        enp1s0:
          networkRef:
            name: primary
          ipAddress: 192.168.150.21
          macAddress: 52:54:00:30:10:01
      qemuKVM:
        hostRef:
          name: hub-host
    master-2:
      profileRef:
        name: compact-control-plane
      rootDeviceHints:
        deviceName: /dev/vda
      interfaces:
        enp1s0:
          networkRef:
            name: primary
          ipAddress: 192.168.150.22
          macAddress: 52:54:00:30:10:02
      qemuKVM:
        hostRef:
          name: hub-host
  endpoints:
    api:
      address: 192.168.150.10
    apiInt:
      address: 192.168.150.10
    ingress:
      address: 192.168.150.11
  loadBalancers:
    lb-qemu-3-hosts-hub:
      placement:
        providerHostRef:
          name: hub-host
      endpoints:
        - api
        - apiInt
        - ingress
  nameResolution:
    managed:
      providerHostRefs:
        - name: hub-host
      additionalIngressHosts:
        - console-openshift-console.apps.qemu-3-hosts-hub.gitups.test
        - oauth-openshift.apps.qemu-3-hosts-hub.gitups.test
