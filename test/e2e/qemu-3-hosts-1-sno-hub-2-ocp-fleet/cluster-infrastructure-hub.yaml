apiVersion: gitups.io/v1alpha1
kind: ClusterInfrastructure
metadata:
  name: qemu-3-hosts-sno-hub
spec:
  providerRef:
    name: qemu-3-hosts-sno-hub-fleet-provider
  networks:
    primary:
      cidr: 192.168.150.0/24
      gateway: 192.168.150.1
      dnsServers:
        - 192.168.150.1
      libvirt:
        bridge: vbr-hub
  machines:
    master-0:
      resources:
        cpu: 8
        memoryMiB: 20480
        diskGiB: 120
      rootDeviceHints:
        deviceName: /dev/vda
      interfaces:
        enp1s0:
          networkRef:
            name: primary
          ipAddress: 192.168.150.20
          macAddress: 52:54:00:30:10:00
      libvirt:
        hostRef:
          name: hub-host
  endpoints:
    api:
      address: 192.168.150.10
    apiInt:
      address: 192.168.150.10
    ingress:
      address: 192.168.150.11
  loadBalancers:
    lb-qemu-3-hosts-sno-hub:
      placement:
        providerHostRef:
          name: hub-host
      endpoints:
        - api
        - apiInt
        - ingress
  nameResolution:
    managed:
      providerHostRefs:
        - name: hub-host
      additionalIngressHosts:
        - console-openshift-console.apps.qemu-3-hosts-sno-hub.gitups.test
        - oauth-openshift.apps.qemu-3-hosts-sno-hub.gitups.test
