apiVersion: gitups.io/v1alpha1
kind: InfrastructureProvider
metadata:
  name: qemu-3-hosts-sno-hub-fleet-provider
spec:
  hosts:
    hub-host:
      ssh:
        address: 192.168.140.10
        user: root
        keyRef:
          name: provider-host-admin-key
      libvirtURI: qemu:///system
      capabilities:
        - libvirt
        - container-runtime
        - hosts-file
    ocp-01-host:
      ssh:
        address: 192.168.140.11
        user: root
        keyRef:
          name: provider-host-admin-key
      libvirtURI: qemu:///system
      capabilities:
        - libvirt
        - container-runtime
        - hosts-file
    ocp-02-host:
      ssh:
        address: 192.168.140.12
        user: root
        keyRef:
          name: provider-host-admin-key
      libvirtURI: qemu:///system
      capabilities:
        - libvirt
        - container-runtime
        - hosts-file
  machine:
    libvirt:
      hostRefs:
        - name: hub-host
        - name: ocp-01-host
        - name: ocp-02-host
      bmcEmulation:
        port: 8000
        auth:
          credentialRef:
            name: qemu-3-hosts-sno-hub-fleet-bmc-credentials
      machineProfiles:
        compact-control-plane:
          cpu: 4
          memoryMiB: 16384
          diskGiB: 100
