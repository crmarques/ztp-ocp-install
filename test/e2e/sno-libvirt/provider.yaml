apiVersion: bootwright.io/v1alpha1
kind: InfrastructureProvider
metadata:
  name: sno-libvirt-emulated-bare-metal
spec:
  hosts:
    lab-host:
      ssh:
        address: localhost
        keyRef:
          name: provider-host-ssh
      libvirtURI: qemu:///system
      capabilities:
        - libvirt
        - container-runtime
        - hosts-file
        - proxy
  machine:
    libvirt:
      hostRefs:
        - name: lab-host
      bmcEmulation:
        enabled: true
        protocol: redfish
        port: 8000
        auth:
          credentialRef:
            name: bmc-credentials
      machineProfiles:
        sno:
          cpu: 9
          memoryMiB: 19456
          diskGiB: 120
  loadBalancer:
    haProxy:
      hostRef:
        name: lab-host
  proxy:
    squid:
      hostRef:
        name: lab-host
  nameResolution:
    hostsFile:
      hostRefs:
        - name: lab-host
      additionalIngressHosts:
        - console-openshift-console.apps.sno-libvirt.bootwright.test
        - oauth-openshift.apps.sno-libvirt.bootwright.test
