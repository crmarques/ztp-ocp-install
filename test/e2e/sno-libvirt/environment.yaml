apiVersion: bootwright.io/v1alpha1
kind: Environment
metadata:
  name: sno-libvirt
spec:
  baseDomain: bootwright.test
  ocpInstallType: connected
  secrets:
    openshift-pull-secret:
      file: ~/.bootwright/secrets/openshift-pull-secret
    cluster-admin-key:
      file: ~/.ssh/bootwright-ssh-key.pub
    provider-host-ssh:
      file: ~/.ssh/bootwright-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin
    proxy-credentials:
      generated:
        credentials:
          username: proxy
  proxy:
    noProxy:
      - 192.168.132.0/24
    auth:
      proxyAuthRef:
        name: proxy-credentials
  openshift:
    release:
      channel: stable-4.21
      version: 4.21.12
