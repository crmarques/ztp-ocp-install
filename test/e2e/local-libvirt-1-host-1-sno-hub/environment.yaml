apiVersion: gitups.io/v1alpha1
kind: Environment
metadata:
  name: local-libvirt-1-host
spec:
  baseDomain: gitups.test
  ocpInstall:
    disconnected:
      registries:
        mirror:
          url: registry.mirror.local:5000
          credentialsRef:
            name: mirror-registry-credentials
          trustBundleRef:
            name: mirror-registry-ca
        imageDigestSources:
          - source: quay.io/openshift-release-dev/ocp-release
            mirrors:
              - registry.mirror.local:5000/openshift/release-images
          - source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
            mirrors:
              - registry.mirror.local:5000/openshift/release-images
  secrets:
    pullSecretRef:
      name: openshift-pull-secret
    clusterSSHKeyRef:
      name: cluster-admin-key
  keys:
    mirror-registry-ca:
      generated:
        selfSignedCertificate:
          commonName: registry.mirror.local
    mirror-registry-credentials:
      generated:
        credentials:
          username: admin
    local-libvirt-1-host-bmc-credentials:
      generated:
        credentials:
          username: admin
  openshift:
    release:
      channel: stable-4.21
      version: 4.21.10
  componentImages:
    load-balancer:
      haproxy:
        local: registry.mirror.local:5000/library/haproxy:3.2.15
        public: docker.io/library/haproxy:3.2.15
    registry:
      mirror-registry:
        local: registry.mirror.local:5000/library/registry:2
        public: docker.io/library/registry:2
