apiVersion: gitups.io/v1alpha1
kind: Environment
metadata:
  name: container-bastion-local-libvirt-sno
spec:
  baseDomain: gitups.test
  ocpInstall:
    connected: {}
  secrets:
    pullSecretRef:
      name: openshift-pull-secret
    clusterSSHKeyRef:
      name: cluster-admin-key
  keys:
    cluster-admin-key:
      file: ~/.ssh/gitups-ssh-key.pub
    openshift-pull-secret:
      file: ~/.gitups/secrets/openshift-pull-secret
    provider-host-ssh:
      file: ~/.ssh/gitups-ssh-key
    bmc-credentials:
      generated:
        credentials:
          username: admin

  openshift:
    release:
      channel: stable-4.21
      version: 4.21.12
