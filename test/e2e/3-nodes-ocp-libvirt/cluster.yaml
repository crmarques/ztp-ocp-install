apiVersion: gitups.io/v1alpha1
kind: OCPCluster
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  role: managed
  topology: multi-node
  infrastructureRef:
    name: 3-nodes-ocp-libvirt
  install:
    method: agent
  networking:
    clusterNetwork:
      - cidr: 10.128.0.0/14
        hostPrefix: 23
    serviceNetwork:
      - 172.30.0.0/16
  nodes:
    master-0:
      role: control-plane
    master-1:
      role: control-plane
    master-2:
      role: control-plane
