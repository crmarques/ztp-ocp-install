apiVersion: bootwright.io/v1alpha1
kind: InfrastructureProvider
metadata:
  name: 3-nodes-ocp-libvirt-emulated-bare-metal
spec:
  hosts:
    lab-host:
      ssh:
        address: localhost
        keyRef:
          name: provider-host-ssh
      libvirtURI: qemu:///system
      capabilities:
        - libvirt
        - container-runtime
        - hosts-file
        - proxy
  machine:
    libvirt:
      hostRefs:
        - name: lab-host
      bmcEmulation:
        enabled: true
        protocol: redfish
        port: 8000
        auth:
          credentialRef:
            name: bmc-credentials
      machineProfiles:
        compact-control-plane:
          cpu: 4
          memoryMiB: 16384
          diskGiB: 120
  loadBalancer:
    haProxy:
      hostRef:
        name: lab-host
  proxy:
    squid:
      hostRef:
        name: lab-host
  nameResolution:
    hostsFile:
      hostRefs:
        - name: lab-host
      additionalIngressHosts:
        - console-openshift-console.apps.3-nodes-ocp-libvirt.bootwright.test
        - oauth-openshift.apps.3-nodes-ocp-libvirt.bootwright.test
