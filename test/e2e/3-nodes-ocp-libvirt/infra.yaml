apiVersion: bootwright.io/v1alpha1
kind: ClusterInfrastructure
metadata:
  name: 3-nodes-ocp-libvirt
spec:
  providerRefs:
    - name: 3-nodes-ocp-libvirt-emulated-bare-metal
  networks:
    primary:
      cidr: 192.168.133.0/24
      gateway: 192.168.133.1
      dnsServers:
        - 192.168.133.1
      libvirt:
        bridge: vbr-cb-3n
  machines:
    master-0:
      profileRef:
        name: compact-control-plane
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.133.20
          macAddress: 52:54:00:33:11:10
      rootDeviceHints:
        deviceName: /dev/vda
      libvirt:
        hostRef:
          name: lab-host
    master-1:
      profileRef:
        name: compact-control-plane
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.133.21
          macAddress: 52:54:00:33:11:11
      rootDeviceHints:
        deviceName: /dev/vda
      libvirt:
        hostRef:
          name: lab-host
    master-2:
      profileRef:
        name: compact-control-plane
      interfaces:
        primary:
          networkRef:
            name: primary
          ipAddress: 192.168.133.22
          macAddress: 52:54:00:33:11:12
      rootDeviceHints:
        deviceName: /dev/vda
      libvirt:
        hostRef:
          name: lab-host
  endpoints:
    api:
      address: 192.168.133.10
    apiInt:
      address: 192.168.133.10
    ingress:
      address: 192.168.133.11
  loadBalancers:
    default:
      endpoints:
        - api
        - apiInt
        - ingress
