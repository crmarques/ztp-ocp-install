apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-controllers-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "__GITUPS_PLACEHOLDER__"
    path: "."
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
