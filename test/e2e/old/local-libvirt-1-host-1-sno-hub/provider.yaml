apiVersion: gitups.io/v1alpha1
kind: InfrastructureProvider
metadata:
  name: local-libvirt-1-host-provider
spec:
  hosts:
    local-libvirt-host:
      ssh:
        address: localhost
        keyRef:
          name: local-libvirt-host-admin-key
      libvirtURI: qemu:///system
      capabilities:
        - libvirt
        - container-runtime
        - hosts-file
        - mirror-registry
  machine:
    libvirt:
      hostRefs:
        - name: local-libvirt-host
      bmcEmulation:
        port: 8000
        auth:
          credentialRef:
            name: local-libvirt-1-host-bmc-credentials
  loadBalancer:
    haProxy:
      hostRef:
        name: local-libvirt-host
  nameResolution:
    hostsFile:
      hostRefs:
        - name: local-libvirt-host
      additionalIngressHosts:
        - console-openshift-console.apps.local-libvirt-1-host-hub.gitups.test
        - oauth-openshift.apps.local-libvirt-1-host-hub.gitups.test
  registry:
    mirrorRegistry:
      hostRef:
        name: local-libvirt-host
      port: 5000
