apiVersion: gitups.io/v1alpha1
kind: Environment
metadata:
  name: local-libvirt-1-host
spec:
  baseDomain: gitups.test
  ocpInstall:
    disconnected:
      registries:
        mirror:
          url: registry.mirror.local:5000
          credentialsRef:
            name: mirror-registry-credentials
          trustBundleRef:
            name: mirror-registry-ca
        imageDigestSources:
          - source: quay.io/openshift-release-dev/ocp-release
            mirrors:
              - registry.mirror.local:5000/openshift/release-images
          - source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
            mirrors:
              - registry.mirror.local:5000/openshift/release-images
  secrets:
    pullSecretRef:
      name: openshift-pull-secret
    clusterSSHKeyRef:
      name: cluster-admin-key
  keys:
    openshift-pull-secret:
      file: ~/.gitups/secrets/openshift-pull-secret
    cluster-admin-key:
      file: ~/.ssh/gitups-ssh-key.pub
    local-libvirt-host-admin-key:
      file: ~/.ssh/gitups-ssh-key
    mirror-registry-ca:
      generated:
        selfSignedCertificate:
          commonName: registry.mirror.local
    mirror-registry-credentials:
      generated:
        credentials:
          username: admin
    local-libvirt-1-host-bmc-credentials:
      generated:
        credentials:
          username: admin
  openshift:
    release:
      channel: stable-4.21
      version: 4.21.12
  componentImages:
    load-balancer:
      haproxy:
        local: registry.mirror.local:5000/library/haproxy:3.3.8
        public: docker.io/library/haproxy:3.3.8@sha256:f14a1788b56894e7ec7b5cb0ca09dbb959b674cf3c980f92139ec008167d4a91
    registry:
      mirror-registry:
        local: registry.mirror.local:5000/library/registry:3.1.1
        public: docker.io/library/registry:3.1.1@sha256:85347ed2ecde64161c7a4788a4d7d3dcc9d6f86f7be95834022e3c6a423a945a
