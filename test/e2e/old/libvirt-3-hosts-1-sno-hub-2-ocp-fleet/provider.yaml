apiVersion: gitups.io/v1alpha1
kind: InfrastructureProvider
metadata:
  name: libvirt-3-hosts-sno-hub-provider
spec:
  hosts:
    hub-host:
      ssh:
        address: 192.168.140.10
        user: root
        keyRef:
          name: provider-host-admin-key
      libvirtURI: qemu:///system
      capabilities:
        - libvirt
        - container-runtime
        - hosts-file
  machine:
    libvirt:
      hostRefs:
        - name: hub-host
      bmcEmulation:
        port: 8000
        auth:
          credentialRef:
            name: libvirt-3-hosts-sno-hub-fleet-bmc-credentials
      machineProfiles:
        compact-control-plane:
          cpu: 4
          memoryMiB: 16384
          diskGiB: 100
  loadBalancer:
    haProxy:
      hostRef:
        name: hub-host
  nameResolution:
    hostsFile:
      hostRefs:
        - name: hub-host
      additionalIngressHosts:
        - console-openshift-console.apps.libvirt-3-hosts-sno-hub.gitups.test
        - oauth-openshift.apps.libvirt-3-hosts-sno-hub.gitups.test
---
