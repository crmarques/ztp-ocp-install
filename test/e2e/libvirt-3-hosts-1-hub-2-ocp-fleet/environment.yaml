apiVersion: gitups.io/v1alpha1
kind: Environment
metadata:
  name: libvirt-3-hosts-hub-fleet
spec:
  baseDomain: gitups.test
  ocpInstall:
    restricted:
      proxy:
        httpProxy: http://proxy.example.test:3128
        httpsProxy: http://proxy.example.test:3128
        credentialsRef:
          name: proxy-credentials
        noProxy:
          - localhost
          - 127.0.0.0/8
          - ::1
          - .svc
          - .cluster.local
          - .gitups.test
          - 192.168.140.0/24
          - 192.168.150.0/24
          - 192.168.151.0/24
          - 192.168.152.0/24
          - 10.128.0.0/14
          - 172.30.0.0/16
  secrets:
    pullSecretRef:
      name: openshift-pull-secret
    clusterSSHKeyRef:
      name: cluster-admin-key
  keys:
    openshift-pull-secret:
      file: ~/.gitups/secrets/openshift-pull-secret
    cluster-admin-key:
      file: ~/.ssh/gitups-ssh-key.pub
    provider-host-admin-key:
      file: ~/.ssh/gitups-ssh-key
    proxy-credentials:
      file: ~/.gitups/secrets/proxy-credentials
    libvirt-3-hosts-hub-fleet-bmc-credentials:
      generated:
        credentials:
          username: admin
  openshift:
    release:
      channel: stable-4.21
      version: 4.21.12
