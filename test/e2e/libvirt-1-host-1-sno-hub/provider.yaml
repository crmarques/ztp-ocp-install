apiVersion: gitups.io/v1alpha1
kind: InfrastructureProvider
metadata:
  name: libvirt-1-host-provider
spec:
  hosts:
    remote-libvirt-host:
      ssh:
        address: 10.73.7.236
        user: crmarques
        keyRef:
          name: remote-libvirt-host-admin-key
      libvirtURI: qemu:///system
      capabilities:
        - libvirt
        - container-runtime
        - hosts-file
  machine:
    libvirt:
      hostRefs:
        - name: remote-libvirt-host
      bmcEmulation:
        port: 8000
        auth:
          credentialRef:
            name: libvirt-1-host-bmc-credentials
  loadBalancer:
    haProxy:
      hostRef:
        name: remote-libvirt-host
  nameResolution:
    hostsFile:
      hostRefs:
        - name: remote-libvirt-host
      additionalIngressHosts:
        - console-openshift-console.apps.libvirt-1-host-hub.gitups.test
        - oauth-openshift.apps.libvirt-1-host-hub.gitups.test
