apiVersion: gitups.io/v1alpha1
kind: Environment
metadata:
  name: local-libvirt-sno-hub-gitea
spec:
  baseDomain: gitups.test
  ocpInstall:
    connected: {}
  secrets:
    pullSecretRef:
      name: openshift-pull-secret
    clusterSSHKeyRef:
      name: cluster-admin-key
  keys:
    openshift-pull-secret:
      file: ~/.gitups/secrets/openshift-pull-secret
    cluster-admin-key:
      file: ~/.ssh/gitups-ssh-key.pub
    local-libvirt-host-admin-key:
      file: ~/.ssh/gitups-ssh-key
    local-libvirt-sno-hub-bmc-credentials:
      generated:
        credentials:
          username: admin
  openshift:
    release:
      channel: stable-4.21
      version: 4.21.12
